name: Wasti One-Time Security Hardening V3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reuse validated hardening codemod
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/_wasti_hardening_v2.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = workflow.index(marker) + len(marker)
          tail = workflow[start:]
          end = tail.index('\n\n      - name: Compile and run focused authority tests')
          script = textwrap.dedent(tail[:end])
          exec(compile(script, '<validated-hardening-codemod>', 'exec'), {})

      - name: Compile hardened application
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Commit hardened state and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test/java/com/example/data/security/WastiAuthorityInvariantTest.kt
          git rm -f .github/workflows/_wasti_hardening_once.yml .github/workflows/_wasti_hardening_v2.yml .github/workflows/_wasti_hardening_v3.yml
          git commit -m "security: close authority and verification boundaries"
          git push origin HEAD:main
