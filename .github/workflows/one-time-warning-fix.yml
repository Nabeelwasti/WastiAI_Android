name: One-time warning cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[warning-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic warning fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changed = False

          identity = Path('app/src/main/java/com/example/data/auth/WastiIdentityManager.kt')
          text = identity.read_text()
          old = '''        if (isOwnerVerified && entitlementCandidate != null) {\n            consumeNonce(entitlementCandidate.nonce)\n        }'''
          new = '''        if (isOwnerVerified) {\n            entitlementCandidate?.nonce?.let(::consumeNonce)\n        }'''
          if old in text:
              identity.write_text(text.replace(old, new, 1))
              changed = True
          elif new not in text:
              raise SystemExit('Expected WastiIdentityManager warning pattern was not found')

          workspace = Path('app/src/main/java/com/example/ui/screens/ChatWorkspaceScreen.kt')
          text = workspace.read_text()
          if 'ttsEngine != null' in text:
              workspace.write_text(text.replace('ttsEngine != null', '::ttsEngine.isInitialized', 1))
              changed = True
          elif '::ttsEngine.isInitialized' not in text:
              raise SystemExit('Expected ChatWorkspaceScreen ttsEngine warning pattern was not found')

          connections = Path('app/src/main/java/com/example/ui/screens/ConnectionsAndVaultScreen.kt')
          text = connections.read_text()
          if 'Icons.Filled.Login' in text:
              connections.write_text(text.replace('Icons.Filled.Login', 'Icons.AutoMirrored.Filled.Login', 1))
              changed = True
          elif 'Icons.AutoMirrored.Filled.Login' not in text:
              raise SystemExit('Expected Login icon pattern was not found')

          print(f'warning-fix changes applied: {changed}')
          PY

      - name: Verify changed files
        shell: bash
        run: |
          set -euo pipefail
          grep -n "if (isOwnerVerified)" app/src/main/java/com/example/data/auth/WastiIdentityManager.kt
          grep -n "isInitialized" app/src/main/java/com/example/ui/screens/ChatWorkspaceScreen.kt
          grep -n "AutoMirrored.Filled.Login" app/src/main/java/com/example/ui/screens/ConnectionsAndVaultScreen.kt

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/auth/WastiIdentityManager.kt \
                  app/src/main/java/com/example/ui/screens/ChatWorkspaceScreen.kt \
                  app/src/main/java/com/example/ui/screens/ConnectionsAndVaultScreen.kt \
                  .github/workflows/one-time-warning-fix.yml
          git commit -m 'fix: remove remaining build warnings [warning-fix]'
          git rm .github/workflows/one-time-warning-fix.yml
          git commit --amend --no-edit
          git push origin HEAD:main
