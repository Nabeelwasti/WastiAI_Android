name: One-shot Wasti execution repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply canonical execution repair and warning cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          fabric = Path('app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt')
          text = fabric.read_text(encoding='utf-8')

          terminal = '''            capId.startsWith("wre_tool_") || capId in listOf(
                "terminal", "execute_code", "execute_command", "run_script", "sh", "cmd",
                "bash", "python", "python3", "python_runtime", "node", "nodejs",
                "node_runtime", "javascript", "npm"
            ) -> executeTerminalOperations(request, capId, ctx, startedAt)

'''
          registry = '''            com.example.data.tool.ToolRegistry.getTool(request.capabilityId) != null ||
            com.example.data.tool.ToolRegistry.getTool(capId) != null ->
                executeToolRegistryOperation(request, startedAt)

'''

          if terminal not in text or registry not in text:
              raise SystemExit('Expected execution dispatch blocks were not found; refusing an unsafe rewrite.')
          if text.index(terminal) > text.index(registry):
              text = text.replace(registry + terminal, terminal + registry, 1)

          fabric.write_text(text, encoding='utf-8')

          # Remove the remaining deprecated consent overloads from tests. Production
          # code already uses the context-aware APIs where a Context is available.
          audit = Path('app/src/test/java/com/example/data/core/EternalManifestoAndTruthAuditTest.kt')
          if audit.exists():
              s = audit.read_text(encoding='utf-8')
              s = re.sub(r'pm\.setUserConsent\(("[^"]+"),\s*(true|false)\)', r'pm.setUserConsent(ApplicationProvider.getApplicationContext(), \1, \2)', s)
              s = re.sub(r'pm\.hasUserConsent\(("[^"]+")\)', r'pm.hasUserConsent(ApplicationProvider.getApplicationContext(), \1)', s)
              audit.write_text(s, encoding='utf-8')

          stage6 = Path('app/src/test/java/com/example/data/agent/runtime/Stage6ObservationVerificationTest.kt')
          if stage6.exists():
              s = stage6.read_text(encoding='utf-8')
              s = re.sub(r'PermissionManager\.setUserConsent\(("[^"]+"),\s*(true|false)\)', r'PermissionManager.setUserConsent(ApplicationProvider.getApplicationContext(), \1, \2)', s)
              stage6.write_text(s, encoding='utf-8')

          # Make the recursion invariant explicit in the Stage 14 suite. The test
          # executes the real terminal capability through the canonical fabric and
          # proves that ToolRegistry registration does not re-enter the fabric.
          stage14 = Path('app/src/test/java/com/example/Stage14SelfEvolvingCapabilityEngineTest.kt')
          s = stage14.read_text(encoding='utf-8')
          marker = '    @Test\n    fun testTerminalCapabilityDoesNotRecursivelyReenterFabric()'
          if marker not in s:
              method = '''    @Test\n    fun testTerminalCapabilityDoesNotRecursivelyReenterFabric() = runTest(testDispatcher) {\n        assertNotNull("Terminal capability must remain discoverable", ToolRegistry.getTool("terminal"))\n\n        val request = UnifiedExecutionRequest(\n            capabilityId = "terminal",\n            parameters = mapOf(\n                "command" to "printf wasti-terminal-routing",\n                "workingDirectory" to "home/wasti"\n            ),\n            requestedStrategy = com.example.data.agent.runtime.ExecutionStrategy.LOCAL_FALLBACK,\n            timeoutMs = 5_000L\n        )\n\n        val result = UnifiedExecutionFabric.instance.execute(request, context)\n\n        assertNotEquals(\n            "Terminal execution must never fail by recursively re-entering UnifiedExecutionFabric",\n            UnifiedExecutionStatus.FAILED,\n            result.status\n        )\n        assertFalse(\n            "A recursion/stack-overflow failure must never be reported as truthful terminal execution",\n            result.error?.contains("StackOverflowError", ignoreCase = true) == true\n        )\n        assertTrue(\n            "Terminal routing must reach the real execution fabric path: ${result.output}",\n            result.output.contains("wasti-terminal-routing") || result.status == UnifiedExecutionStatus.UNAVAILABLE\n        )\n    }\n\n'''
              idx = s.rfind('\n}')
              if idx < 0:
                  raise SystemExit('Stage 14 test class closing brace not found.')
              s = s[:idx] + '\n' + method + s[idx:]
              stage14.write_text(s, encoding='utf-8')

      - name: Verify Stage 14 regression before commit
        run: ./gradlew :app:testDebugUnitTest --tests 'com.example.Stage14SelfEvolvingCapabilityEngineTest' --no-configuration-cache --stacktrace
        timeout-minutes: 10

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt \
                  app/src/test/java/com/example/Stage14SelfEvolvingCapabilityEngineTest.kt \
                  app/src/test/java/com/example/data/agent/runtime/Stage6ObservationVerificationTest.kt \
                  app/src/test/java/com/example/data/core/EternalManifestoAndTruthAuditTest.kt
          git rm --cached .github/workflows/repair-execution-fabric.yml || true
          git add -u .github/workflows/repair-execution-fabric.yml || true
          if git diff --cached --quiet; then
            echo 'No repair changes were necessary.'
            exit 0
          fi
          git commit -m 'fix(execution): prevent terminal fabric recursion and remove consent deprecations'
          git push origin HEAD:main
