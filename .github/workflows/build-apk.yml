name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Ensure Gradle Wrapper Executable
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 9.3.1
        fi
        chmod +x gradlew

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Decode Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "Restored debug.keystore from base64"
        fi

    - name: Generate .env File from GitHub Secrets
      run: |
        cat << 'EOF' > .env
        XAI_API_KEY=${{ secrets.XAI_API_KEY }}
        GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
        DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
        OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
        GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
        ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
        CANVA_CLIENT_ID=${{ secrets.CANVA_CLIENT_ID }}
        CANVA_CLIENT_SECRET=${{ secrets.CANVA_CLIENT_SECRET }}
        WASTI_GIT_PAT=${{ secrets.WASTI_GIT_PAT }}
        WASTI_GIT_FINE_GRAINED_PAT=${{ secrets.WASTI_GIT_FINE_GRAINED_PAT }}
        BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
        BREVO_MCP_SERVER_API_KEY=${{ secrets.BREVO_MCP_SERVER_API_KEY }}
        STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_SANDBOX_RESTRICTED_KEY_TOKEN=${{ secrets.STRIPE_SANDBOX_RESTRICTED_KEY_TOKEN }}
        DRIVE_CLIENT_ID=${{ secrets.DRIVE_CLIENT_ID }}
        DRIVE_CLIENT_SECRET=${{ secrets.DRIVE_CLIENT_SECRET }}
        HUGGINGFACE_ACCESS_TOKEN=${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
        UNSPLASH_APP_ID=${{ secrets.UNSPLASH_APP_ID }}
        UNSPLASH_ACCESS_KEY=${{ secrets.UNSPLASH_ACCESS_KEY }}
        UNSPLASH_SECRET_KEY=${{ secrets.UNSPLASH_SECRET_KEY }}
        DISCORD_BOT_ID=${{ secrets.DISCORD_BOT_ID }}
        DISCORD_BOT_KEY=${{ secrets.DISCORD_BOT_KEY }}
        BYTEZ_API_KEY=${{ secrets.BYTEZ_API_KEY }}
        CLOUDFLARE_API_KEY=${{ secrets.CLOUDFLARE_API_KEY }}
        NOTION_CONNECTION_ID=${{ secrets.NOTION_CONNECTION_ID }}
        HUBSPOT_CONNECTION_ID=${{ secrets.HUBSPOT_CONNECTION_ID }}
        SLACK_DOMAIN=${{ secrets.SLACK_DOMAIN }}
        ZAPIER_CONNECT_TOKEN=${{ secrets.ZAPIER_CONNECT_TOKEN }}
        ZAPIER_MCP_SHARE_LINK=${{ secrets.ZAPIER_MCP_SHARE_LINK }}
        GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || '206322177649-fs2048huimberjvb4etaih1scn7ldh30.apps.googleusercontent.com' }}
        GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID || '206322177649-dmntaoaft0r4fj8qaurnpoapqmav4lrj.apps.googleusercontent.com' }}
        GMAIL_SENDER_EMAIL=${{ secrets.GMAIL_SENDER_EMAIL || 'wastinabeel99@gmail.com' }}
        GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
        GOOGLE_ACCOUNT_PASSWORD=${{ secrets.GOOGLE_ACCOUNT_PASSWORD }}
        EOF
        echo "Successfully generated .env file for build."

    - name: Run Unit Tests
      timeout-minutes: 15
      run: ./gradlew testDebugUnitTest --no-configuration-cache --stacktrace

    - name: Run Android Lint
      timeout-minutes: 10
      run: ./gradlew lintDebug --no-configuration-cache --stacktrace

    - name: Build Debug APK
      timeout-minutes: 15
      run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

    - name: Verify WastiApplication in APK
      run: |
        APK="app/build/outputs/apk/debug/app-debug.apk"
        echo "APK: $APK"
        echo "Checking all DEX files..."

        FOUND=0

        for DEX in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do
          echo "Checking $DEX..."
          if unzip -p "$APK" "$DEX" | grep -a -q "WastiApplication"; then
            echo "SUCCESS: WastiApplication found in $DEX"
            FOUND=1
          fi
        done

        if [ "$FOUND" -eq 0 ]; then
          echo "ERROR: WastiApplication NOT FOUND in any DEX file"
          exit 1
        fi

        echo "SUCCESS: WastiApplication exists in APK"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WastiAI-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create or Update GitHub Release
      if: github.event_name != 'pull_request'
      uses: ncipollo/release-action@v1
      continue-on-error: true
      with:
        artifacts: "app/build/outputs/apk/debug/app-debug.apk"
        tag: "v1.0.0"
        name: "Wasti AI v1.0.0 (Latest APK)"
        body: |
          ### 📱 Wasti AI Latest Build
          - **File:** `app-debug.apk`
          - Download the `app-debug.apk` file below and open it on your Android phone to install!
        allowUpdates: true
        replacesArtifacts: true
        token: ${{ secrets.GITHUB_TOKEN }}
