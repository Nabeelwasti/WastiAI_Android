name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This workflow only builds/tests. Release publication requires a separate
    # explicitly authorized workflow and must never run with write privileges here.
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER_BIN=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_BIN="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "ERROR: Android SDK manager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER_BIN" --licenses >/tmp/android-sdk-licenses.log 2>&1 || {
            echo "ERROR: Android SDK license acceptance failed."
            cat /tmp/android-sdk-licenses.log
            exit 1
          }
          echo "Android SDK licenses accepted."

      - name: Generate Safe .env File for Build
        run: |
          cp .env.example .env
          if [ -n "${{ secrets.GOOGLE_WEB_CLIENT_ID }}" ]; then
            sed -i "s|^GOOGLE_WEB_CLIENT_ID=.*|GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}|" .env
          fi
          if [ -n "${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}" ]; then
            sed -i "s|^GOOGLE_ANDROID_CLIENT_ID=.*|GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}|" .env
          fi

      - name: Run Unit Tests
        timeout-minutes: 15
        run: ./gradlew testDebugUnitTest --no-configuration-cache --no-build-cache --stacktrace

      - name: Run Debug Lint
        timeout-minutes: 10
        run: ./gradlew lintDebug --no-configuration-cache --no-build-cache --stacktrace

      - name: Run Strict Release Lint
        timeout-minutes: 10
        run: ./gradlew lintRelease --no-configuration-cache --no-build-cache --stacktrace

      - name: Verify Release Kotlin Compilation
        timeout-minutes: 15
        run: ./gradlew compileReleaseKotlin --no-configuration-cache --no-build-cache --stacktrace

      - name: Build Debug APK
        timeout-minutes: 15
        run: ./gradlew assembleDebug --no-configuration-cache --no-build-cache --stacktrace

      - name: Verify WastiApplication in Manifest and DEX
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -Z1 "$APK" | grep -q '^AndroidManifest.xml$'
          FOUND=0
          for DEX in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do
            if unzip -p "$APK" "$DEX" | grep -a -q 'WastiApplication'; then
              FOUND=1
              break
            fi
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: WastiApplication was not found in APK DEX files."
            exit 1
          fi
          echo "WastiApplication bytecode integrity verified."

      - name: APK Secret Boundary Scan
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p /tmp/apk_inspect
          trap 'rm -rf /tmp/apk_inspect' EXIT
          unzip -q "$APK" -d /tmp/apk_inspect
          # Detect actual credential/token formats, not variable names used by code.
          PATTERNS=(
            'ghp_[A-Za-z0-9]{30,}'
            'gho_[A-Za-z0-9]{30,}'
            'github_pat_[A-Za-z0-9_]{50,}'
            'xoxb-[0-9-]{20,}'
            'sk-ant-[A-Za-z0-9_-]{20,}'
            'AKIA[0-9A-Z]{16}'
            'sk_live_[A-Za-z0-9]{20,}'
            'rk_live_[A-Za-z0-9]{20,}'
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
          )
          for PATTERN in "${PATTERNS[@]}"; do
            if grep -rEn "$PATTERN" /tmp/apk_inspect/; then
              echo "ERROR: Private credential pattern detected in APK: $PATTERN"
              exit 1
            fi
          done
          echo "APK secret boundary scan passed."

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WastiAI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
