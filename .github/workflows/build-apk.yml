name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  validate:
    name: Validate, Test & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      have_release_keystore: ${{ steps.signing_config.outputs.have_release_keystore }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p "$ANDROID_HOME/licenses"
        printf '%s\n%s\n%s\n' \
          "8933bad161af4178b1185d1a37fbf41ea5269c55" \
          "d56f5187479451eabf01fb78af6dfcb131a6481e" \
          "24333f8a63b1e9751435240a53ac13cdd4e75608" > "$ANDROID_HOME/licenses/android-sdk-license"
        printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
        printf '%s\n%s\n' \
          "601085b94c79f3b24e146dd3920d091007e92b34" \
          "0dce45676d31a37a373783b352b085870b207574" > "$ANDROID_HOME/licenses/android-googletv-license"
        printf '%s\n' "33b6a2b64920268e304a4ddb1216b3a777e9b41e" > "$ANDROID_HOME/licenses/google-gdk-license"
        printf '%s\n' "e9acab5b5fbb560a72cfa4f23690f4086beab3ac" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
        printf '%s\n' "859f317696f67ef3d7f30a50a5560e7834b43903" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
        test -s "$ANDROID_HOME/licenses/android-sdk-license" || { echo "ERROR: Failed to write android-sdk-license"; exit 1; }
        echo "Android SDK licenses accepted deterministically."

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Decode Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "Restored debug.keystore from base64"
        fi

    - name: Verify google-services.json is Not Tracked by Git
      run: |
        if git ls-files --error-unmatch app/google-services.json 2>/dev/null; then
          echo "ERROR: app/google-services.json must NOT be tracked by Git in the public repository!"
          exit 1
        fi
        echo "SUCCESS: app/google-services.json is not tracked by Git."

    - name: Securely Inject and Validate Firebase Configuration
      env:
        FIREBASE_CONFIG_SECRET: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$FIREBASE_CONFIG_SECRET" ]; then
          # Safely write authentic Google Services configuration to app/google-services.json without echoing to logs
          printf '%s' "$FIREBASE_CONFIG_SECRET" > app/google-services.json

          # Validate JSON format, project info, and package name without printing secrets
          python3 scripts/validate_google_services_json.py
        else
          echo "NOTICE: FIREBASE_GOOGLE_SERVICES_JSON secret not configured. Standalone and fail-closed cloud runtime preserved."
        fi

    - name: Generate Safe .env and Configuration for APK Build
      env:
        # AI & Model Providers
        SECRET_GEMINI: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
        SECRET_GROQ: ${{ secrets.GROQ_API_KEY }}
        SECRET_OPENAI: ${{ secrets.OPENAI_API_KEY }}
        SECRET_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
        SECRET_DEEPSEEK: ${{ secrets.DEEPSEEK_API_KEY }}
        SECRET_XAI: ${{ secrets.XAI_API_KEY }}
        SECRET_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY }}
        SECRET_HUGGINGFACE: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN || secrets.HUGGINGFACE_API_KEY }}
        SECRET_BYTEZ: ${{ secrets.BYTEZ_API_KEY }}
        SECRET_LOCAL_LLM_URL: ${{ secrets.LOCAL_LLM_URL }}

        # Google OAuth, Drive & Gmail
        SECRET_GOOGLE_WEB_CLIENT_ID: ${{ secrets.PUBLIC_GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
        SECRET_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.PUBLIC_GOOGLE_ANDROID_CLIENT_ID || secrets.GOOGLE_ANDROID_CLIENT_ID }}
        SECRET_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        SECRET_DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
        SECRET_DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
        SECRET_GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
        SECRET_GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        SECRET_GMAIL_OAUTH_TOKEN: ${{ secrets.GMAIL_OAUTH_TOKEN }}
        SECRET_GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
        SECRET_GOOGLE_OAUTH_ACCESS_TOKEN: ${{ secrets.GOOGLE_OAUTH_ACCESS_TOKEN }}
        SECRET_GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        SECRET_GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
        SECRET_SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        SECRET_GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}

        # Business, Stripe & Brevo
        SECRET_STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        SECRET_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        SECRET_STRIPE_WEBHOOK: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        SECRET_STRIPE_SANDBOX_KEY: ${{ secrets.STRIPE_SANDBOX_RESTRICTED_KEY_TOKEN }}
        SECRET_BREVO: ${{ secrets.BREVO_API_KEY }}
        SECRET_BREVO_MCP_SERVER_KEY: ${{ secrets.BREVO_MCP_SERVER_API_KEY }}
        SECRET_HUBSPOT: ${{ secrets.HUBSPOT_CONNECTION_ID }}
        SECRET_UPWORK_CLIENT_ID: ${{ secrets.UPWORK_OAUTH_CLIENT_ID }}
        SECRET_UPWORK_CLIENT_SECRET: ${{ secrets.UPWORK_OAUTH_CLIENT_SECRET }}
        SECRET_UPWORK_RSS_URL: ${{ secrets.UPWORK_RSS_CUSTOM_URL }}

        # Code & Git Repositories
        SECRET_WASTI_GIT_FINE_GRAINED_PAT: ${{ secrets.WASTI_GIT_FINE_GRAINED_PAT }}
        SECRET_WASTI_GIT_PAT: ${{ secrets.WASTI_GIT_PAT }}
        SECRET_BACKEND_GITHUB_PAT: ${{ secrets.BACKEND_GITHUB_PAT }}
        SECRET_ALLOWED_GITHUB_REPOS: ${{ secrets.ALLOWED_GITHUB_REPOS }}
        SECRET_ALLOWED_PATCH_BRANCHES: ${{ secrets.ALLOWED_PATCH_BRANCHES }}

        # Assets & Infrastructure
        SECRET_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_KEY }}
        SECRET_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        SECRET_UNSPLASH_APP_ID: ${{ secrets.UNSPLASH_APP_ID }}
        SECRET_UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        SECRET_UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
        SECRET_CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
        SECRET_CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
        SECRET_CANVA_ACCESS_TOKEN: ${{ secrets.CANVA_ACCESS_TOKEN }}
        SECRET_BACKEND_AUTH: ${{ secrets.WASTI_BACKEND_AUTH_SECRET }}
        SECRET_PUBLIC_API_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
        SECRET_WASTI_BACKEND_URL: ${{ secrets.WASTI_BACKEND_URL }}
        SECRET_BACKEND_GEMINI_KEY: ${{ secrets.BACKEND_GEMINI_KEY }}
        SECRET_BACKEND_GROQ_VOICE: ${{ secrets.BACKEND_GROQ_VOICE }}
        SECRET_OUTREACH_APPROVAL_TOKEN: ${{ secrets.OUTREACH_APPROVAL_TOKEN }}
        SECRET_ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}

        # Automation & Communications
        SECRET_ELEVENLABS: ${{ secrets.ELEVENLABS_API_KEY }}
        SECRET_LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
        SECRET_LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        SECRET_LINKEDIN_OAUTH_TOKEN: ${{ secrets.LINKEDIN_OAUTH_TOKEN }}
        SECRET_LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        SECRET_LINKEDIN_OAUTH_REFRESH_TOKEN: ${{ secrets.LINKEDIN_OAUTH_REFRESH_TOKEN }}
        SECRET_LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
        SECRET_LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        SECRET_ZAPIER_CONNECT_TOKEN: ${{ secrets.ZAPIER_CONNECT_TOKEN }}
        SECRET_ZAPIER_MCP_SHARE_LINK: ${{ secrets.ZAPIER_MCP_SHARE_LINK }}
        SECRET_NOTION_CONNECTION_ID: ${{ secrets.NOTION_CONNECTION_ID }}
        SECRET_SLACK_DOMAIN: ${{ secrets.SLACK_DOMAIN }}
        SECRET_DISCORD_BOT_ID: ${{ secrets.DISCORD_BOT_ID }}
        SECRET_DISCORD_BOT_KEY: ${{ secrets.DISCORD_BOT_KEY }}
      run: |
        if [ -f ".env.example" ]; then
          cp .env.example .env
        else
          touch .env
        fi
        
        inject_secret() {
          local key="$1"
          local val="$2"
          if [ -n "$val" ]; then
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${val}|" .env
            else
              echo "${key}=${val}" >> .env
            fi
          fi
        }

        # Model Providers
        inject_secret "GEMINI_API_KEY" "$SECRET_GEMINI"
        inject_secret "GROQ_API_KEY" "$SECRET_GROQ"
        inject_secret "OPENAI_API_KEY" "$SECRET_OPENAI"
        inject_secret "ANTHROPIC_API_KEY" "$SECRET_ANTHROPIC"
        inject_secret "DEEPSEEK_API_KEY" "$SECRET_DEEPSEEK"
        inject_secret "XAI_API_KEY" "$SECRET_XAI"
        inject_secret "OPENROUTER_API_KEY" "$SECRET_OPENROUTER"
        inject_secret "HUGGINGFACE_ACCESS_TOKEN" "$SECRET_HUGGINGFACE"
        inject_secret "BYTEZ_API_KEY" "$SECRET_BYTEZ"
        inject_secret "LOCAL_LLM_URL" "$SECRET_LOCAL_LLM_URL"

        # Auth, Firebase & Google Workspace
        inject_secret "PUBLIC_GOOGLE_WEB_CLIENT_ID" "$SECRET_GOOGLE_WEB_CLIENT_ID"
        inject_secret "PUBLIC_GOOGLE_ANDROID_CLIENT_ID" "$SECRET_GOOGLE_ANDROID_CLIENT_ID"
        inject_secret "GOOGLE_WEB_CLIENT_ID" "$SECRET_GOOGLE_WEB_CLIENT_ID"
        inject_secret "GOOGLE_ANDROID_CLIENT_ID" "$SECRET_GOOGLE_ANDROID_CLIENT_ID"
        inject_secret "GOOGLE_API_KEY" "$SECRET_GOOGLE_API_KEY"
        inject_secret "DRIVE_CLIENT_ID" "$SECRET_DRIVE_CLIENT_ID"
        inject_secret "DRIVE_CLIENT_SECRET" "$SECRET_DRIVE_CLIENT_SECRET"
        inject_secret "GMAIL_SENDER_EMAIL" "$SECRET_GMAIL_SENDER_EMAIL"
        inject_secret "GMAIL_APP_PASSWORD" "$SECRET_GMAIL_APP_PASSWORD"
        inject_secret "GMAIL_OAUTH_TOKEN" "$SECRET_GMAIL_OAUTH_TOKEN"
        inject_secret "GMAIL_OAUTH_REFRESH_TOKEN" "$SECRET_GMAIL_OAUTH_REFRESH_TOKEN"
        inject_secret "GOOGLE_OAUTH_ACCESS_TOKEN" "$SECRET_GOOGLE_OAUTH_ACCESS_TOKEN"
        inject_secret "GOOGLE_REFRESH_TOKEN" "$SECRET_GOOGLE_REFRESH_TOKEN"
        inject_secret "GOOGLE_SEARCH_API_KEY" "$SECRET_GOOGLE_SEARCH_API_KEY"
        inject_secret "SEARCH_API_KEY" "$SECRET_SEARCH_API_KEY"
        inject_secret "GOOGLE_SEARCH_CX" "$SECRET_GOOGLE_SEARCH_CX"

        # Business, Stripe & Brevo
        inject_secret "STRIPE_SECRET_KEY" "$SECRET_STRIPE_KEY"
        inject_secret "STRIPE_PUBLISHABLE_KEY" "$SECRET_STRIPE_PUBLISHABLE_KEY"
        inject_secret "STRIPE_WEBHOOK_SECRET" "$SECRET_STRIPE_WEBHOOK"
        inject_secret "STRIPE_SANDBOX_RESTRICTED_KEY_TOKEN" "$SECRET_STRIPE_SANDBOX_KEY"
        inject_secret "BREVO_API_KEY" "$SECRET_BREVO"
        inject_secret "BREVO_MCP_SERVER_API_KEY" "$SECRET_BREVO_MCP_SERVER_KEY"
        inject_secret "HUBSPOT_CONNECTION_ID" "$SECRET_HUBSPOT"
        inject_secret "UPWORK_OAUTH_CLIENT_ID" "$SECRET_UPWORK_CLIENT_ID"
        inject_secret "UPWORK_OAUTH_CLIENT_SECRET" "$SECRET_UPWORK_CLIENT_SECRET"
        inject_secret "UPWORK_RSS_CUSTOM_URL" "$SECRET_UPWORK_RSS_URL"

        # Code & Git Repositories
        inject_secret "WASTI_GIT_FINE_GRAINED_PAT" "$SECRET_WASTI_GIT_FINE_GRAINED_PAT"
        inject_secret "WASTI_GIT_PAT" "$SECRET_WASTI_GIT_PAT"
        inject_secret "BACKEND_GITHUB_PAT" "$SECRET_BACKEND_GITHUB_PAT"
        inject_secret "ALLOWED_GITHUB_REPOS" "$SECRET_ALLOWED_GITHUB_REPOS"
        inject_secret "ALLOWED_PATCH_BRANCHES" "$SECRET_ALLOWED_PATCH_BRANCHES"

        # Assets & Infrastructure
        inject_secret "CLOUDFLARE_API_KEY" "$SECRET_CLOUDFLARE"
        inject_secret "CLOUDFLARE_ACCOUNT_ID" "$SECRET_CLOUDFLARE_ACCOUNT_ID"
        inject_secret "UNSPLASH_APP_ID" "$SECRET_UNSPLASH_APP_ID"
        inject_secret "UNSPLASH_ACCESS_KEY" "$SECRET_UNSPLASH_ACCESS_KEY"
        inject_secret "UNSPLASH_SECRET_KEY" "$SECRET_UNSPLASH_SECRET_KEY"
        inject_secret "CANVA_CLIENT_ID" "$SECRET_CANVA_CLIENT_ID"
        inject_secret "CANVA_CLIENT_SECRET" "$SECRET_CANVA_CLIENT_SECRET"
        inject_secret "CANVA_ACCESS_TOKEN" "$SECRET_CANVA_ACCESS_TOKEN"
        inject_secret "WASTI_BACKEND_AUTH_SECRET" "$SECRET_BACKEND_AUTH"
        inject_secret "PUBLIC_API_BASE_URL" "$SECRET_PUBLIC_API_URL"
        inject_secret "WASTI_BACKEND_URL" "$SECRET_WASTI_BACKEND_URL"
        inject_secret "BACKEND_GEMINI_KEY" "$SECRET_BACKEND_GEMINI_KEY"
        inject_secret "BACKEND_GROQ_VOICE" "$SECRET_BACKEND_GROQ_VOICE"
        inject_secret "OUTREACH_APPROVAL_TOKEN" "$SECRET_OUTREACH_APPROVAL_TOKEN"
        inject_secret "ALLOWED_ORIGINS" "$SECRET_ALLOWED_ORIGINS"

        # Automation & Communications
        inject_secret "ELEVENLABS_API_KEY" "$SECRET_ELEVENLABS"
        inject_secret "LINKEDIN_CLIENT_ID" "$SECRET_LINKEDIN_CLIENT_ID"
        inject_secret "LINKEDIN_CLIENT_SECRET" "$SECRET_LINKEDIN_CLIENT_SECRET"
        inject_secret "LINKEDIN_OAUTH_TOKEN" "$SECRET_LINKEDIN_OAUTH_TOKEN"
        inject_secret "LINKEDIN_ACCESS_TOKEN" "$SECRET_LINKEDIN_ACCESS_TOKEN"
        inject_secret "LINKEDIN_OAUTH_REFRESH_TOKEN" "$SECRET_LINKEDIN_OAUTH_REFRESH_TOKEN"
        inject_secret "LINKEDIN_REFRESH_TOKEN" "$SECRET_LINKEDIN_REFRESH_TOKEN"
        inject_secret "LINKEDIN_AUTHOR_URN" "$SECRET_LINKEDIN_AUTHOR_URN"
        inject_secret "ZAPIER_CONNECT_TOKEN" "$SECRET_ZAPIER_CONNECT_TOKEN"
        inject_secret "ZAPIER_MCP_SHARE_LINK" "$SECRET_ZAPIER_MCP_SHARE_LINK"
        inject_secret "NOTION_CONNECTION_ID" "$SECRET_NOTION_CONNECTION_ID"
        inject_secret "SLACK_DOMAIN" "$SECRET_SLACK_DOMAIN"
        inject_secret "DISCORD_BOT_ID" "$SECRET_DISCORD_BOT_ID"
        inject_secret "DISCORD_BOT_KEY" "$SECRET_DISCORD_BOT_KEY"
        
        echo "Successfully injected all 45+ repository secrets into build environment."

    - name: Generate Truthful Secrets Ingestion Report
      run: |
        python3 scripts/generate_secrets_report.py .env

    - name: Run Backend Syntax & Security Validation Tests
      run: |
        node -c backend/index.js backend/brevo.js backend/stripe_helper.js backend/firebase_helper.js backend/orchestrator.js backend/auth_helper.js backend/wakeword_queue.js backend/verify_backend_deployment.js
        node --test backend/test_backend.js
        echo "SUCCESS: Backend syntax and security tests verified."

    - name: Run Unit Tests
      timeout-minutes: 15
      run: ./gradlew testDebugUnitTest --no-configuration-cache --no-build-cache --stacktrace

    - name: Run Android Lint (Debug)
      timeout-minutes: 10
      run: ./gradlew lintDebug --no-configuration-cache --no-build-cache --stacktrace

    - name: Build Debug APK
      timeout-minutes: 15
      run: ./gradlew assembleDebug --no-configuration-cache --no-build-cache --stacktrace

    - name: Verify WastiApplication in Manifest and DEX
      run: |
        APK="app/build/outputs/apk/debug/app-debug.apk"
        echo "Validating APK: $APK"
        unzip -Z1 "$APK" | grep -q "AndroidManifest.xml" || { echo "ERROR: AndroidManifest.xml missing in APK"; exit 1; }
        
        FOUND=0
        for DEX in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do
          if unzip -p "$APK" "$DEX" | grep -a -q "Lcom/example/WastiApplication;"; then
            echo "SUCCESS: WastiApplication class descriptor verified in $DEX"
            FOUND=1
          elif unzip -p "$APK" "$DEX" | grep -a -q "WastiApplication"; then
            echo "INFO: WastiApplication reference found in $DEX"
            FOUND=1
          fi
        done

        if [ "$FOUND" -eq 0 ]; then
          echo "ERROR: WastiApplication NOT FOUND in APK DEX files"
          exit 1
        fi
        echo "SUCCESS: WastiApplication bytecode integrity verified."

    - name: Configure Production Release Signing
      id: signing_config
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "Decoding release keystore to /tmp/release.keystore..."
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          test -s /tmp/release.keystore || { echo "ERROR: Failed to decode release keystore."; exit 1; }
          chmod 600 /tmp/release.keystore
          echo "HAVE_RELEASE_KEYSTORE=true" >> $GITHUB_ENV
          echo "have_release_keystore=true" >> $GITHUB_OUTPUT
          echo "SUCCESS: Production release keystore configured."
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          echo "ERROR: Release tag triggered without RELEASE_KEYSTORE_BASE64 secret. Failing closed."
          exit 1
        else
          echo "NOTICE: RELEASE_KEYSTORE_BASE64 secret is not configured in this environment."
          echo "Production release packaging marked BLOCKED_EXTERNAL_DEPENDENCY."
          echo "HAVE_RELEASE_KEYSTORE=false" >> $GITHUB_ENV
          echo "have_release_keystore=false" >> $GITHUB_OUTPUT
        fi

    - name: Build and Sign Production Release Artifacts (APK & AAB)
      if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.HAVE_RELEASE_KEYSTORE == 'true'
      timeout-minutes: 20
      env:
        KEYSTORE_PATH: /tmp/release.keystore
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_ALIAS || 'upload' }}
      run: |
        echo "Building genuine production release APK and Android App Bundle..."
        ./gradlew assembleRelease bundleRelease --no-configuration-cache --no-build-cache --stacktrace

        RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
        RELEASE_AAB="app/build/outputs/bundle/release/app-release.aab"
        test -f "$RELEASE_APK" || { echo "ERROR: Release APK was not generated at $RELEASE_APK"; exit 1; }
        test -f "$RELEASE_AAB" || { echo "ERROR: Release AAB was not generated at $RELEASE_AAB"; exit 1; }

        echo "Verifying signature and certificate fingerprint with apksigner..."
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
        if [ -x "$APKSIGNER" ]; then
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
        fi
        echo "SUCCESS: Production release artifacts built, signed, and cryptographically verified."

    - name: Verify Release WastiApplication in Manifest and DEX
      if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.HAVE_RELEASE_KEYSTORE == 'true'
      run: |
        APK="app/build/outputs/apk/release/app-release.apk"
        echo "Validating Release APK: $APK"
        unzip -Z1 "$APK" | grep -q "AndroidManifest.xml" || { echo "ERROR: AndroidManifest.xml missing in Release APK"; exit 1; }

        FOUND=0
        for DEX in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do
          if unzip -p "$APK" "$DEX" | grep -a -q "Lcom/example/WastiApplication;"; then
            echo "SUCCESS: WastiApplication class descriptor verified in Release $DEX"
            FOUND=1
          elif unzip -p "$APK" "$DEX" | grep -a -q "WastiApplication"; then
            echo "INFO: WastiApplication reference found in Release $DEX"
            FOUND=1
          fi
        done

        if [ "$FOUND" -eq 0 ]; then
          echo "ERROR: WastiApplication NOT FOUND in Release APK DEX files"
          exit 1
        fi
        echo "SUCCESS: Release WastiApplication bytecode integrity verified."

    - name: Security & Secret Boundary Verification Scan
      shell: bash
      run: |
        echo "Running Comprehensive Secret & Boundary Scan across Source, Backend, Workflows, and APKs..."

        # 1. Scan source code and backend for forbidden raw secret patterns
        echo "Phase 1: Scanning repository source and backend for raw secret patterns..."
        FATAL_PATTERNS=(
          "MY_GOOGLE_ACCOUNT_PASSWORD"
          "GOOGLE_ACCOUNT_PASSWORD"
          "gho_"
          "xoxb-"
          "sk-ant-"
          "AKIA[0-9A-Z]{16}"
          "rk_live_"
          "sk_live_"
        )
        for PATTERN in "${FATAL_PATTERNS[@]}"; do
          if grep -rEn --exclude-dir=".git" --exclude-dir="build" "$PATTERN" app/src/main/ backend/ 2>/dev/null; then
            echo "ERROR: Forbidden secret pattern '$PATTERN' found in source code or backend!"
            exit 1
          fi
        done

        # 2. Scan workflows for live token regexes
        if grep -rEn --exclude-dir=".git" "ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{30,}|xoxb-[0-9]{10,}|sk-ant-[A-Za-z0-9]{20,}|sk_live_[A-Za-z0-9]{24,}|rk_live_[A-Za-z0-9]{24,}" .github/workflows/ 2>/dev/null; then
          echo "ERROR: Actual live API token found in workflows!"
          exit 1
        fi

        # 3. APK Secret Boundary Scan (Scans all generated APKs: debug and release)
        TARGET_APKS=()
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          TARGET_APKS+=("app/build/outputs/apk/debug/app-debug.apk")
        fi
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          TARGET_APKS+=("app/build/outputs/apk/release/app-release.apk")
        fi

        for TARGET_APK in "${TARGET_APKS[@]}"; do
          echo "Phase 2: Scanning APK bytecode, manifest, and bundled resources for $TARGET_APK..."
          mkdir -p /tmp/apk_inspect
          unzip -q "$TARGET_APK" -d /tmp/apk_inspect

          # 3a. Verify canonical package ID in APK manifest
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$AAPT" ] && [ -x "$AAPT" ] && "$AAPT" dump badging "$TARGET_APK" 2>/dev/null | grep -q "com.aistudio.wastios.k9v2pz"; then
            echo "SUCCESS: Canonical package ID verified via aapt in $TARGET_APK"
          else
            python3 -c "import zipfile, sys; apk = sys.argv[1]; b = zipfile.ZipFile(apk).read('AndroidManifest.xml'); sys.exit(0 if (b'com.aistudio.wastios.k9v2pz' in b or 'com.aistudio.wastios.k9v2pz'.encode('utf-16le') in b) else 1)" "$TARGET_APK" || {
              echo "ERROR: Canonical package ID 'com.aistudio.wastios.k9v2pz' not found in $TARGET_APK AndroidManifest.xml!"
              exit 1
            }
            echo "SUCCESS: Canonical package ID verified via binary AXML in $TARGET_APK"
          fi

          # 3b. Verify WastiApplication bytecode integrity
          FOUND_APP=0
          for DEX in $(unzip -Z1 "$TARGET_APK" | grep -E '^classes[0-9]*\.dex$'); do
            if unzip -p "$TARGET_APK" "$DEX" | grep -a -q "WastiApplication"; then
              FOUND_APP=1
              break
            fi
          done
          if [ "$FOUND_APP" -eq 0 ]; then
            echo "ERROR: WastiApplication class missing in $TARGET_APK DEX files!"
            exit 1
          fi

          # 3c. Verify signing certificate on release APK
          if [[ "$TARGET_APK" == *"release"* ]]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
            if [ -x "$APKSIGNER" ]; then
              echo "Verifying cryptographic certificate for $TARGET_APK..."
              "$APKSIGNER" verify --verbose --print-certs "$TARGET_APK" || {
                echo "ERROR: apksigner certificate verification failed on $TARGET_APK!"
                exit 1
              }
            fi
          fi

          # 3d. Scan APK for fatal raw secret patterns
          for PATTERN in "${FATAL_PATTERNS[@]}"; do
            if grep -rEn "$PATTERN" /tmp/apk_inspect/; then
              echo "ERROR: Forbidden secret pattern '$PATTERN' found inside $TARGET_APK!"
              exit 1
            fi
          done

          if grep -rEn "ghp_[A-Za-z0-9]{36}" /tmp/apk_inspect/; then
            echo "ERROR: Actual GitHub Personal Access Token found inside $TARGET_APK!"
            exit 1
          fi

          if grep -rEn "BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY" /tmp/apk_inspect/assets/ /tmp/apk_inspect/res/ 2>/dev/null; then
            echo "ERROR: Private key certificate/file bundled in $TARGET_APK assets or resources!"
            exit 1
          fi
          rm -rf /tmp/apk_inspect
          echo "SUCCESS: $TARGET_APK passed package ID, certificate, bytecode, and secret boundary verification."
        done

        # 4. Release AAB (Android App Bundle) Secret & Artifact Boundary Scan
        if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
          AAB="app/build/outputs/bundle/release/app-release.aab"
          echo "Phase 3: Scanning Release AAB bytecode and bundled resources for $AAB..."
          mkdir -p /tmp/aab_inspect
          unzip -q "$AAB" -d /tmp/aab_inspect

          # Verify base manifest and DEX files exist in AAB
          test -f /tmp/aab_inspect/base/manifest/AndroidManifest.xml || { echo "ERROR: base/manifest/AndroidManifest.xml missing in AAB"; exit 1; }
          test -f /tmp/aab_inspect/base/dex/classes.dex || { echo "ERROR: base/dex/classes.dex missing in AAB"; exit 1; }

          # Verify package ID in AAB manifest (protobuf or UTF-8/UTF-16 binary XML)
          python3 -c "import sys; b = open('/tmp/aab_inspect/base/manifest/AndroidManifest.xml', 'rb').read(); sys.exit(0 if (b'com.aistudio.wastios.k9v2pz' in b or 'com.aistudio.wastios.k9v2pz'.encode('utf-16le') in b) else 1)" || {
            echo "ERROR: Canonical package ID 'com.aistudio.wastios.k9v2pz' missing in AAB manifest!"
            exit 1
          }

          # Scan AAB for secret patterns
          for PATTERN in "${FATAL_PATTERNS[@]}"; do
            if grep -rEn "$PATTERN" /tmp/aab_inspect/; then
              echo "ERROR: Forbidden secret pattern '$PATTERN' found inside $AAB!"
              exit 1
            fi
          done

          if grep -rEn "ghp_[A-Za-z0-9]{36}" /tmp/aab_inspect/; then
            echo "ERROR: Actual GitHub Personal Access Token found inside $AAB!"
            exit 1
          fi

          if grep -rEn "BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY" /tmp/aab_inspect/base/assets/ /tmp/aab_inspect/base/res/ 2>/dev/null; then
            echo "ERROR: Private key certificate/file bundled in $AAB assets or resources!"
            exit 1
          fi

          rm -rf /tmp/aab_inspect
          echo "SUCCESS: Release AAB passed package ID, bytecode, and secret boundary verification."
        fi

        # 5. Strictly forbid private key files/certificates in source assets or resources
        if grep -rEn --exclude-dir=".git" "BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY" app/src/main/assets/ app/src/main/res/ 2>/dev/null; then
          echo "ERROR: Private key certificate/file bundled in source assets or resources!"
          exit 1
        fi

        # 5. In compiled bytecode (DEX) and source, scan for actual embedded private keys with base64 payload blocks
        python3 scripts/scan_private_keys.py

        echo "SUCCESS: Comprehensive source, backend, workflow, and APK secret boundary scan passed cleanly."

    - name: Execute Release Runtime & Evidence Verification
      if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.HAVE_RELEASE_KEYSTORE == 'true'
      run: |
        chmod +x scripts/verify_release_runtime.sh
        ./scripts/verify_release_runtime.sh app/build/outputs/apk/release/app-release.apk release_verification_evidence.json

    - name: Execute Debug Runtime & Evidence Verification
      if: env.HAVE_RELEASE_KEYSTORE != 'true'
      run: |
        chmod +x scripts/verify_release_runtime.sh
        ./scripts/verify_release_runtime.sh app/build/outputs/apk/debug/app-debug.apk debug_verification_evidence.json

    - name: Cleanup Sensitive Build Files
      if: always()
      run: |
        rm -f app/google-services.json
        rm -f /tmp/release.keystore
        rm -f debug.keystore
        rm -f .env
        echo "Cleaned up temporary sensitive build files."

    - name: Upload Debug Artifact
      uses: actions/upload-artifact@v7
      with:
        name: WastiAI-Debug-APK
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          debug_verification_evidence.json

    - name: Stage Release Artifacts
      if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.HAVE_RELEASE_KEYSTORE == 'true'
      run: |
        mkdir -p build-release-artifacts
        cp app/build/outputs/apk/release/app-release.apk build-release-artifacts/
        cp app/build/outputs/bundle/release/app-release.aab build-release-artifacts/
        if [ -f "release_verification_evidence.json" ]; then
          cp release_verification_evidence.json build-release-artifacts/
        fi

    - name: Upload Release Artifacts
      if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.HAVE_RELEASE_KEYSTORE == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: WastiAI-Release-Artifacts
        path: build-release-artifacts/

  publish:
    name: Publish Release Artifact
    needs: validate
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request' && needs.validate.outputs.have_release_keystore == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Download Built Release Artifacts
      uses: actions/download-artifact@v8
      with:
        name: WastiAI-Release-Artifacts
        path: build-artifacts/

    - name: Determine Canonical Release Version & Tag
      id: release_meta
      shell: bash
      run: |
        echo "Inspecting downloaded release artifacts:"
        find build-artifacts -type f
        find build-artifacts -type f -name "app-release.apk" -exec cp -f {} build-artifacts/app-release.apk \;
        find build-artifacts -type f -name "app-release.aab" -exec cp -f {} build-artifacts/app-release.aab \;
        find build-artifacts -type f -name "release_verification_evidence.json" -exec cp -f {} build-artifacts/release_verification_evidence.json \;

        test -f build-artifacts/app-release.apk || { echo "ERROR: Genuine signed app-release.apk missing. Release aborted."; exit 1; }
        test -f build-artifacts/app-release.aab || { echo "ERROR: Genuine signed app-release.aab missing. Release aborted."; exit 1; }

        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TITLE="Wasti AI ${TAG_NAME}"
        else
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG_NAME="v1.0.0-main-${SHORT_SHA}"
          TITLE="Wasti AI ${TAG_NAME}"
        fi
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "title=${TITLE}" >> $GITHUB_OUTPUT
        echo "SUCCESS: Derived release tag: ${TAG_NAME}"

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          build-artifacts/app-release.apk
          build-artifacts/app-release.aab
          build-artifacts/release_verification_evidence.json
        tag_name: ${{ steps.release_meta.outputs.tag_name }}
        name: ${{ steps.release_meta.outputs.title }}
        overwrite_files: true
        make_latest: true
        fail_on_unmatched_files: false
        body: |
          ### 📱 Wasti AI Production Release
          - **Tag:** `${{ steps.release_meta.outputs.tag_name }}`
          - **Commit:** `${{ github.sha }}`
          - **Artifacts:**
            - `app-release.apk` (Signed Production APK)
            - `app-release.aab` (Signed Production Android App Bundle)
            - `release_verification_evidence.json` (Cryptographic & Runtime Verification Evidence)
          - Cryptographically signed with release keystore and verified by `apksigner`.
          - Passed multi-tier zero-trust secret and bytecode boundary scans.
        generate_release_notes: false
        token: ${{ secrets.GITHUB_TOKEN }}
