name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    name: Validate, Test & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p "$ANDROID_HOME/licenses"
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b1e9751435240a53ac13cdd4e75608" > "$ANDROID_HOME/licenses/android-sdk-license"
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
        echo -e "\n601085b94c79f3b24e146dd3920d091007e92b34" > "$ANDROID_HOME/licenses/android-googletv-license"
        echo -e "\n33b6a2b64920268e304a4ddb1216b3a777e9b41e" > "$ANDROID_HOME/licenses/google-gdk-license"
        echo -e "\ne9acab5b5fbb560a72cfa4f23690f4086beab3ac" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
        echo "Android SDK licenses accepted."

    - name: Decode Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "Restored debug.keystore from base64"
        fi

    - name: Verify google-services.json is Not Tracked by Git
      run: |
        if git ls-files --error-unmatch app/google-services.json 2>/dev/null; then
          echo "ERROR: app/google-services.json must NOT be tracked by Git in the public repository!"
          exit 1
        fi
        echo "SUCCESS: app/google-services.json is not tracked by Git."

    - name: Securely Inject and Validate Firebase Configuration
      env:
        FIREBASE_CONFIG_SECRET: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
      run: |
        if [ -z "$FIREBASE_CONFIG_SECRET" ]; then
          echo "ERROR: Required GitHub Secret 'FIREBASE_GOOGLE_SERVICES_JSON' is missing or empty!"
          exit 1
        fi

        # Safely write to app/google-services.json without echoing to logs
        printf '%s' "$FIREBASE_CONFIG_SECRET" > app/google-services.json

        # Validate JSON format, project info, and package name without printing secrets
        python3 - << 'PYEOF'
        import json, sys

        try:
            with open("app/google-services.json", "r") as f:
                data = json.load(f)
        except Exception as e:
            print(f"ERROR: app/google-services.json is not valid JSON: {e}")
            sys.exit(1)

        project_info = data.get("project_info", {})
        project_id = project_info.get("project_id", "")
        project_number = project_info.get("project_number", "")

        if "wasti-ai" not in project_id:
            print(f"ERROR: Expected Firebase project 'wasti-ai', found '{project_id}'.")
            sys.exit(1)

        clients = data.get("client", [])
        packages = []
        for client in clients:
            pkg = client.get("client_info", {}).get("android_client_info", {}).get("package_name")
            if pkg:
                packages.append(pkg)

        valid_packages = {"com.aistudio.wastios.k9v2pz"}
        matching_pkgs = [p for p in packages if p in valid_packages]
        if not matching_pkgs:
            print(f"ERROR: Canonical package 'com.aistudio.wastios.k9v2pz' not found in google-services.json clients: {packages}")
            sys.exit(1)

        print(f"SUCCESS: Validated Firebase configuration for project '{project_id}' (number: {project_number}) containing package(s): {matching_pkgs}.")
        PYEOF

    - name: Generate Safe .env and Configuration for APK Build
      run: |
        if [ -f ".env.example" ]; then
          cp .env.example .env
        else
          touch .env
        fi
        for KEY in \
          XAI_API_KEY GEMINI_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY DEEPSEEK_API_KEY \
          OPENROUTER_API_KEY GROQ_API_KEY ELEVENLABS_API_KEY CANVA_CLIENT_ID CANVA_CLIENT_SECRET \
          WASTI_GIT_PAT WASTI_GIT_FINE_GRAINED_PAT BREVO_API_KEY BREVO_MCP_SERVER_API_KEY \
          STRIPE_PUBLISHABLE_KEY STRIPE_SECRET_KEY STRIPE_SANDBOX_RESTRICTED_KEY_TOKEN \
          DRIVE_CLIENT_ID DRIVE_CLIENT_SECRET HUGGINGFACE_ACCESS_TOKEN UNSPLASH_APP_ID \
          UNSPLASH_ACCESS_KEY UNSPLASH_SECRET_KEY DISCORD_BOT_ID DISCORD_BOT_KEY BYTEZ_API_KEY \
          CLOUDFLARE_API_KEY NOTION_CONNECTION_ID HUBSPOT_CONNECTION_ID SLACK_DOMAIN \
          ZAPIER_CONNECT_TOKEN ZAPIER_MCP_SHARE_LINK GOOGLE_WEB_CLIENT_ID GOOGLE_ANDROID_CLIENT_ID \
          GMAIL_SENDER_EMAIL GMAIL_APP_PASSWORD; do
          if ! grep -q "^$KEY=" .env; then
            echo "$KEY=MY_${KEY}" >> .env
          fi
        done
        if [ -n "${{ secrets.GOOGLE_WEB_CLIENT_ID }}" ]; then
          sed -i "s|^GOOGLE_WEB_CLIENT_ID=.*|GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}|" .env
        fi
        if [ -n "${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}" ]; then
          sed -i "s|^GOOGLE_ANDROID_CLIENT_ID=.*|GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}|" .env
        fi
        echo "Safely generated .env file for build."

    - name: Run Backend Syntax & Security Validation Tests
      run: |
        node -c backend/index.js backend/brevo.js backend/stripe_helper.js backend/firebase_helper.js backend/orchestrator.js
        node --test backend/test_backend.js
        echo "SUCCESS: Backend syntax and security tests verified."

    - name: Run Unit Tests
      timeout-minutes: 15
      run: ./gradlew testDebugUnitTest --no-configuration-cache --no-build-cache --stacktrace

    - name: Run Android Lint (Debug)
      timeout-minutes: 10
      run: ./gradlew lintDebug --no-configuration-cache --no-build-cache --stacktrace

    - name: Build Debug APK
      timeout-minutes: 15
      run: ./gradlew assembleDebug --no-configuration-cache --no-build-cache --stacktrace

    - name: Verify WastiApplication in Manifest and DEX
      run: |
        APK="app/build/outputs/apk/debug/app-debug.apk"
        echo "Validating APK: $APK"
        unzip -Z1 "$APK" | grep -q "AndroidManifest.xml" || { echo "ERROR: AndroidManifest.xml missing in APK"; exit 1; }
        
        FOUND=0
        for DEX in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do
          if unzip -p "$APK" "$DEX" | grep -a -q "Lcom/example/WastiApplication;"; then
            echo "SUCCESS: WastiApplication class descriptor verified in $DEX"
            FOUND=1
          elif unzip -p "$APK" "$DEX" | grep -a -q "WastiApplication"; then
            echo "INFO: WastiApplication reference found in $DEX"
            FOUND=1
          fi
        done

        if [ "$FOUND" -eq 0 ]; then
          echo "ERROR: WastiApplication NOT FOUND in APK DEX files"
          exit 1
        fi
        echo "SUCCESS: WastiApplication bytecode integrity verified."

    - name: Security & Secret Boundary Verification Scan
      shell: bash
      run: |
        APK="app/build/outputs/apk/debug/app-debug.apk"
        echo "Running APK Secret Boundary Scan..."
        mkdir -p /tmp/apk_inspect
        unzip -q "$APK" -d /tmp/apk_inspect
        
        # 1. High-risk plaintext secret tokens that must never exist in the binary or resources
        FATAL_PATTERNS=(
          "MY_GOOGLE_ACCOUNT_PASSWORD"
          "GOOGLE_ACCOUNT_PASSWORD"
          "gho_"
          "xoxb-"
          "sk-ant-"
          "AKIA[0-9A-Z]{16}"
          "rk_live_"
          "sk_live_"
        )
        for PATTERN in "${FATAL_PATTERNS[@]}"; do
          if grep -rEn "$PATTERN" /tmp/apk_inspect/; then
            echo "ERROR: Forbidden secret pattern '$PATTERN' found inside APK!"
            exit 1
          fi
        done

        # 2. GitHub Personal Access Token boundary check (actual ghp_[36 alphanum chars])
        if grep -rEn "ghp_[A-Za-z0-9]{36}" /tmp/apk_inspect/; then
          echo "ERROR: Actual GitHub Personal Access Token found inside APK!"
          exit 1
        fi

        # 3. Private Key boundary verification
        # Strictly forbid private key files/certificates in assets or resources
        if grep -rEn "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" /tmp/apk_inspect/assets/ /tmp/apk_inspect/res/ 2>/dev/null; then
          echo "ERROR: Private key certificate/file bundled in APK assets or resources!"
          exit 1
        fi

        # In compiled bytecode (DEX), scan for actual embedded private keys containing base64 payload blocks,
        # distinguishing real keys from Okio/OkHttp's HeldCertificate PEM formatting template constants
        python3 - << 'PYEOF'
        import os, sys, re

        inspect_dir = "/tmp/apk_inspect"
        key_block_regex = re.compile(
            r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----\s*[A-Za-z0-9+/=]{40,}",
            re.MULTILINE
        )

        found_leak = False
        for root, dirs, files in os.walk(inspect_dir):
            for file in files:
                filepath = os.path.join(root, file)
                try:
                    with open(filepath, "rb") as f:
                        content = f.read().decode("latin1", errors="ignore")
                    if key_block_regex.search(content):
                        print(f"ERROR: Actual embedded private key with payload found in {filepath}!")
                        found_leak = True
                except Exception:
                    pass

        if found_leak:
            sys.exit(1)
        print("SUCCESS: Private key boundary verified — no actual private keys embedded.")
        PYEOF

        rm -rf /tmp/apk_inspect
        echo "SUCCESS: Comprehensive APK secret boundary scan passed cleanly."

    - name: Cleanup Sensitive Build Files
      if: always()
      run: |
        rm -f app/google-services.json
        echo "Cleaned up temporary app/google-services.json."

    - name: Upload Debug Artifact
      uses: actions/upload-artifact@v7
      with:
        name: WastiAI-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

  publish:
    name: Publish Release Artifact
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Download Built Artifact
      uses: actions/download-artifact@v8
      with:
        name: WastiAI-Debug-APK
        path: build-artifacts/

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: build-artifacts/app-debug.apk
        tag_name: "v1.0.0"
        name: "Wasti AI v1.0.0 (Latest APK)"
        overwrite_files: true
        make_latest: true
        fail_on_unmatched_files: true
        body: |
          ### 📱 Wasti AI Latest Build
          - **File:** `app-debug.apk`
          - Download the `app-debug.apk` file below and install on your Android device.
        generate_release_notes: false
        token: ${{ secrets.GITHUB_TOKEN }}
