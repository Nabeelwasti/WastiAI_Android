name: Build Android APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager >/dev/null 2>&1 || {
            echo "ERROR: sdkmanager is unavailable after Android SDK setup."
            exit 1
          }
          yes | sdkmanager --licenses >/dev/null
          echo "Android SDK licenses accepted."

      - name: Generate Safe .env File for APK Build
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          if [ -n "${{ secrets.GOOGLE_WEB_CLIENT_ID }}" ]; then
            sed -i "s|^GOOGLE_WEB_CLIENT_ID=.*|GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}|" .env
          fi
          if [ -n "${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}" ]; then
            sed -i "s|^GOOGLE_ANDROID_CLIENT_ID=.*|GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}|" .env
          fi
          echo "Generated build-time .env from non-secret placeholders/public identifiers only."

      - name: Run Unit Tests
        timeout-minutes: 15
        run: ./gradlew testDebugUnitTest --no-configuration-cache --no-build-cache --stacktrace

      - name: Run Debug Lint
        timeout-minutes: 10
        run: ./gradlew lintDebug --no-configuration-cache --no-build-cache --stacktrace

      - name: Build Debug APK (PR validation)
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        run: ./gradlew assembleDebug --no-configuration-cache --no-build-cache --stacktrace

      - name: Verify Production Signing Configuration
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "ERROR: RELEASE_KEYSTORE_BASE64 is not configured."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ERROR: RELEASE_STORE_PASSWORD is not configured."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: RELEASE_KEY_PASSWORD is not configured."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: RELEASE_KEY_ALIAS is not configured."; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore" || { echo "ERROR: Decoded release keystore is empty."; exit 1; }
          echo "Release signing material is present without printing secret values."

      - name: Build Signed Release APK
        if: github.event_name != 'pull_request'
        timeout-minutes: 20
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew lintRelease assembleRelease --no-configuration-cache --no-build-cache --stacktrace

      - name: Verify Release APK Structure
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "ERROR: Signed release APK missing or empty."; exit 1; }
          unzip -Z1 "$APK" | grep -q '^AndroidManifest.xml$'
          FOUND=0
          for DEX in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do
            if unzip -p "$APK" "$DEX" | grep -a -q 'WastiApplication'; then
              FOUND=1
              break
            fi
          done
          test "$FOUND" -eq 1 || { echo "ERROR: WastiApplication not found in release DEX."; exit 1; }
          echo "Release APK structure and WastiApplication bytecode verified."

      - name: Security & Secret Boundary Verification
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            APK="app/build/outputs/apk/debug/app-debug.apk"
          else
            APK="app/build/outputs/apk/release/app-release.apk"
          fi
          test -s "$APK"
          mkdir -p /tmp/apk_inspect
          trap 'rm -rf /tmp/apk_inspect' EXIT
          unzip -q "$APK" -d /tmp/apk_inspect
          PATTERNS=(
            'MY_GOOGLE_ACCOUNT_PASSWORD'
            'GOOGLE_ACCOUNT_PASSWORD'
            'GMAIL_APP_PASSWORD'
            'ghp_[A-Za-z0-9_]+'
            'gho_[A-Za-z0-9_]+'
            'xox[baprs]-[A-Za-z0-9-]+'
            'sk-ant-[A-Za-z0-9_-]+'
            'AKIA[0-9A-Z]{16}'
            'rk_live_[A-Za-z0-9]+'
            'sk_live_[A-Za-z0-9]+'
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          )
          for PATTERN in "${PATTERNS[@]}"; do
            if grep -rEn "$PATTERN" /tmp/apk_inspect/ >/dev/null 2>&1; then
              echo "ERROR: Forbidden secret pattern '$PATTERN' found in APK."
              exit 1
            fi
          done
          echo "APK secret-boundary scan passed."

      - name: Upload Release APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: WastiAI-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: WastiAI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release for Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
