steps:
- name: Checkout Repository
  uses: actions/checkout@v4

- name: Set up JDK 17
  uses: actions/setup-java@v4
  with:
    java-version: '17'
    distribution: 'temurin'

- name: Setup Android SDK
  uses: android-actions/setup-android@v3

- name: Setup Gradle
  uses: gradle/actions/setup-gradle@v4

- name: Accept Android SDK Licenses
  run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

- name: Decode Debug Keystore
  run: |
    if [ -f "debug.keystore.base64" ]; then
      base64 -d debug.keystore.base64 > debug.keystore
      echo "Restored debug.keystore from base64"
    fi

- name: Build Debug APK
  run: ./gradlew assembleDebug --no-daemon --stacktrace

- name: Upload APK Artifact
  uses: actions/upload-artifact@v4
  with:
    name: WastiAI-Debug-APK
    path: app/build/outputs/apk/debug/app-debug.apk

- name: Create or Update GitHub Release
  if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  uses: ncipollo/release-action@v1
  with:
    artifacts: "app/build/outputs/apk/debug/app-debug.apk"
    tag: "v1.0.0"
    name: "Wasti AI v1.0.0 (Latest APK)"
    body: |
      ### 📱 Wasti AI Latest Build
      - **File:** `app-debug.apk`
      - Download the `app-debug.apk` file below and open it on your Android phone to install!
    allowUpdates: true
    token: ${{ secrets.GITHUB_TOKEN }}
