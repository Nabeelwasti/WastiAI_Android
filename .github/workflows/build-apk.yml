name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Decode Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "Restored debug.keystore from base64"
        fi

    - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Inject GitHub Secrets into .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          echo "XAI_API_KEY=${{ secrets.XAI_API_KEY }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" >> .env
          echo "GITHUB_PAT=${{ secrets.GITHUB_PAT }}" >> .env
          echo "GITHUB_FINE_GRAINED_PAT=${{ secrets.GITHUB_FINE_GRAINED_PAT }}" >> .env
          echo "STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" >> .env
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
          echo "STRIPE_SANDBOX_RESTRICTED_KEY_TOKEN=${{ secrets.STRIPE_SANDBOX_RESTRICTED_KEY_TOKEN }}" >> .env
          echo "CLOUDFLARE_API_KEY=${{ secrets.CLOUDFLARE_API_KEY }}" >> .env
          echo "BYTEZ_API_KEY=${{ secrets.BYTEZ_API_KEY }}" >> .env
          echo "BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}" >> .env
          echo "BREVO_MCP_SERVER_API_KEY=${{ secrets.BREVO_MCP_SERVER_API_KEY }}" >> .env
          echo "HUGGINGFACE_ACCESS_TOKEN=${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}" >> .env
          echo "UNSPLASH_ACCESS_KEY=${{ secrets.UNSPLASH_ACCESS_KEY }}" >> .env
          echo "UNSPLASH_SECRET_KEY=${{ secrets.UNSPLASH_SECRET_KEY }}" >> .env
          echo "CANVA_CLIENT_ID=${{ secrets.CANVA_CLIENT_ID }}" >> .env
          echo "CANVA_CLIENT_SECRET=${{ secrets.CANVA_CLIENT_SECRET }}" >> .env
          echo "DRIVE_CLIENT_ID=${{ secrets.BACKEND_DRIVE_CLIENT_ID }}" >> .env
          echo "DRIVE_CLIENT_SECRET=${{ secrets.BACKEND_DRIVE_CLIENT_SECRET }}" >> .env

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WastiAI-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create or Update GitHub Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "app/build/outputs/apk/debug/app-debug.apk"
        tag: "v1.0.0"
        name: "Wasti AI v1.0.0 (Latest APK)"
        body: |
          ### 📱 Wasti AI Latest Build
          - **File:** `app-debug.apk`
          - Download the `app-debug.apk` file below and open it on your Android phone to install!
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
