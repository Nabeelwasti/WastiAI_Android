name: Extract and Sync Mobile Zip

on:
  push:
    paths:
      - 'No1-main.zip' # This script runs the second you finish uploading your zip file

jobs:
  unpack-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Extract All Files and Safe Overwrite
        run: |
          git config --global user.name "Nabeelwasti"
          git config --global user.email "wastinabeel99@gmail.com"
          
          # Unpack the uploaded file archive cleanly
          unzip No1-main.zip
          
          # Safely copy and merge EVERY single file and folder matching your phone layout
          # This overwrites duplicate files while keeping unique assets safe
          cp -r No1-main/. .
          
          # Delete the temporary zip and extra copy folder to keep things clean
          rm -rf No1-main.zip No1-main
          
          # Force save the newly merged code structure back into your main branch
          git add .
          git commit -m "Automated mobile sync: Unpacked and safely merged all files" || exit 0
          git push origin main
