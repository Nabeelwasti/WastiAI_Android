name: Unpack and Merge Mobile Zip

on:
  push:
    paths:
      - '*.zip' # Triggers on ANY zip file upload, no matter the name!

jobs:
  unpack-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Extract All Files and Safe Overwrite
        run: |
          git config --global user.name "Nabeelwasti"
          git config --global user.email "wastinabeel99@gmail.com"
          
          # Automatically find and unzip whatever your zip archive is named
          unzip *.zip
          
          # Cleanly copy and merge every file and folder into the root directory
          cp -r No1-main/. .
          
          # Safely remove the zip and the extra folder to keep the repository tidy
          rm -rf *.zip No1-main
          
          # Push the clean, extracted code structure back to your main branch
          git add .
          git commit -m "Automated mobile sync: Extracted and safely merged all files" || exit 0
          git push origin main
