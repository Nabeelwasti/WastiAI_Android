name: Unpack and Merge Mobile Zip

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

concurrency:
  group: unpack-and-merge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  unpack-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Extract All Files and Safe Overwrite
        run: |
          set -e
          git config --global user.name "Nabeelwasti"
          git config --global user.email "wastinabeel99@gmail.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          mkdir temp_unpack
          unzip *.zip -d temp_unpack/
          rm -f *.zip
          INNER_FOLDER=$(find temp_unpack -maxdepth 2 -type d ! -name "temp_unpack" | head -n 1)
          if [ ! -z "$INNER_FOLDER" ]; then
            cp -r "$INNER_FOLDER"/. .
          fi
          rm -rf temp_unpack

          git add .
          git commit -m "Automated mobile sync: Unpacked and safely merged all files" || exit 0

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                break
              fi
            else
              git rebase --abort
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done
