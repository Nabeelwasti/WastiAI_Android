name: Unpack and Merge Mobile Zip

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch: # Provides a manual trigger button in your Actions tab

# Forces GitHub's internal token to allow writing updates back to main
permissions:
  contents: write

jobs:
  unpack-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Extract All Files and Safe Overwrite
        run: |
          git config --global user.name "Nabeelwasti"
          git config --global user.email "wastinabeel99@gmail.com"
          
          # Authorizes the connection securely using GitHub's native environment variable
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com"
          
          # Unpack the file archive safely
          unzip *.zip
          
          # Locate whatever directory container folder was generated and copy contents cleanly
          INNER_FOLDER=$(find . -maxdepth 1 -type d ! -name "." ! -name ".github" ! -name "target-repo" | head -n 1)
          if [ ! -z "$INNER_FOLDER" ]; then
            cp -r "$INNER_FOLDER"/. .
            rm -rf "$INNER_FOLDER"
          fi
          
          # Wipe the temporary ZIP
          rm -f *.zip
          
          # Save changes back to the main branch
          git add .
          git commit -m "Automated mobile sync: Unpacked and safely merged all files" || exit 0
          git push origin main
