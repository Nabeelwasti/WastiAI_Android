name: Unpack and Merge Mobile Zip

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Extract All Files and Safe Overwrite
        run: |
          set -e
          git config --global user.name "Nabeelwasti"
          git config --global user.email "wastinabeel99@gmail.com"

          # Fixed: correct authenticated remote URL
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip found, nothing to do."
            exit 0
          fi

          mkdir -p temp_unpack
          for z in "${zips[@]}"; do
            unzip -o "$z" -d temp_unpack/
            rm -f "$z"
          done

          # Merge EVERYTHING extracted, not just the first inner folder
          if [ "$(ls -A temp_unpack)" ]; then
            cp -r temp_unpack/. .
          fi
          rm -rf temp_unpack

          git add -A
          git commit -m "Automated mobile sync: Unpacked and safely merged all files" || exit 0
          git push origin main
