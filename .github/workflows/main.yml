name: Unpack and Merge Mobile Zip

on:
  push:
    paths:
      - '*.zip'

jobs:
  unpack-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Extract All Files and Safe Overwrite
        run: |
          git config --global user.name "Nabeelwasti"
          git config --global user.email "wastinabeel99@gmail.com"
          
          # Unzip whatever zip file is found
          unzip *.zip
          
          # Dynamic merge: Find whatever inner folder was created and copy its contents cleanly
          # This completely avoids hardcoded folder name mismatches!
          INNER_FOLDER=$(find . -maxdepth 1 -type d ! -name "." ! -name ".github" ! -name "target-repo" | head -n 1)
          if [ ! -z "$INNER_FOLDER" ]; then
            cp -r "$INNER_FOLDER"/. .
            rm -rf "$INNER_FOLDER"
          fi
          
          # Clean up any residual loose zip archives
          rm -f *.zip
          
          # Force save the newly merged code structure back into your main branch
          git add .
          git commit -m "Automated mobile sync: Extracted and safely merged all files" || exit 0
          git push origin main
