name: Unpack and Merge Mobile Zip

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Extract All Files and Safe Overwrite
        run: |
          git config --global user.name "Nabeelwasti"
          git config --global user.email "wastinabeel99@gmail.com"
          
          # Authorize the connection via internal token
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com"
          
          # 1. Create a temporary folder out of the root path to avoid loop crashes
          mkdir temp_unpack
          
          # 2. Extract your zip file cleanly inside that temporary space
          unzip *.zip -d temp_unpack/
          
          # 3. Completely delete the raw zip archive from the root path first
          rm -f *.zip
          
          # 4. Find the inner directory containing your files and merge them safely
          INNER_FOLDER=$(find temp_unpack -maxdepth 2 -type d ! -name "temp_unpack" | head -n 1)
          if [ ! -z "$INNER_FOLDER" ]; then
            cp -r "$INNER_FOLDER"/. .
          fi
          
          # 5. Clear out the temporary workspace directory completely
          rm -rf temp_unpack
          
          # 6. Save the newly merged clean code structure back into your main branch
          git add .
          git commit -m "Automated mobile sync: Unpacked and safely merged all files" || exit 0
          git push origin main
          
