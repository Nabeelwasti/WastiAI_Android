name: Final Authority Hardening Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority_audit:
    name: Canonical Authority Invariant Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Audit canonical verification authority
        shell: bash
        run: |
          set -euo pipefail

          ! grep -R --line-number 'isRealityVerified: Boolean = true' app/src/main
          ! grep -R --line-number 'WastiSovereign2026!' app/src/main
          ! grep -R --line-number 'verificationStatus = UnifiedVerificationStatus.VERIFIED' app/src/main/java/com/example/data/node app/src/main/java/com/example/data/agent/runtime/CapabilityInventionEngine.kt
          ! grep -R --line-number 'res.status == UnifiedExecutionStatus.COMPLETED' app/src/main/java/com/example/ui

          if grep -R --line-number "permissions:[[:space:]]*$" .github/workflows >/dev/null 2>&1; then
            echo "Workflow permissions declarations detected; individual workflows remain responsible for least privilege."
          fi

          echo "PASS: canonical verification authority invariants are present and no known automatic-verification shortcuts remain."

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Verify no workflow can mutate source
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number -E 'git (commit|push)|contents:[[:space:]]*write' .github/workflows; then
            echo "ERROR: source-mutating workflow authority detected. Production source mutation must occur through reviewed repository changes, not autonomous CI repair."
            exit 1
          fi
          echo "PASS: CI workflows are read-only with respect to repository source."
