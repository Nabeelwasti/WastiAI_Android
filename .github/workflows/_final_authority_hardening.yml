name: Final Authority Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Apply authority hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          def edit(path, replacements):
              p=Path(path); s=p.read_text()
              for old,new in replacements:
                  if old not in s: raise SystemExit(f'MISSING PATTERN in {path}: {old[:180]!r}')
                  s=s.replace(old,new,1)
              p.write_text(s)
          edit('app/src/main/java/com/example/data/agent/runtime/ObservationAndVerification.kt', [('    val isRealityVerified: Boolean = true\n','')])
          edit('app/src/main/java/com/example/data/auth/WastiIdentityManager.kt', [
              ('import android.security.keystore.KeyGenParameterSpec\n','import android.security.keystore.KeyGenParameterSpec\nimport android.security.keystore.KeyInfo\n'),
              ('        val isHardwareBacked: Boolean = true,','        val isHardwareBacked: Boolean = false,'),
              ('        return DeviceAttestationResult(\n            deviceId = devId,\n            publicKeyBase64 = pubKey,\n            challenge = challenge,\n            signatureBase64 = sig,\n            isHardwareBacked = true\n        )','        val hardwareBacked = try {\n            val keyStore = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }\n            val privateKey = keyStore.getKey(KEYSTORE_ALIAS, null) as? java.security.PrivateKey\n            if (privateKey == null) false else {\n                val keyFactory = java.security.KeyFactory.getInstance(privateKey.algorithm, "AndroidKeyStore")\n                val keyInfo = keyFactory.getKeySpec(privateKey, KeyInfo::class.java)\n                keyInfo.isInsideSecureHardware\n            }\n        } catch (_: Throwable) { false }\n        return DeviceAttestationResult(\n            deviceId = devId, publicKeyBase64 = pubKey, challenge = challenge,\n            signatureBase64 = sig, isHardwareBacked = hardwareBacked\n        )')])
          edit('app/src/main/java/com/example/data/node/AutonomousHardwareOffloader.kt', [
              ('verificationStatus = UnifiedVerificationStatus.VERIFIED,','verificationStatus = UnifiedVerificationStatus.UNVERIFIED,'),
              ('verificationEvidence = "Bluetooth RFCOMM execution verified: ${targetNode.capabilityFingerprint}"','verificationEvidence = "Bluetooth RFCOMM peer execution completed; independent local verification required: ${targetNode.capabilityFingerprint}"'),
              ('            verificationStatus = UnifiedVerificationStatus.VERIFIED,\n            verificationEvidence = "Bluetooth verified peer: ${targetNode.addressOrIp} fingerprint: ${targetNode.capabilityFingerprint} (duration: ${duration}ms)"','            verificationStatus = UnifiedVerificationStatus.UNVERIFIED,\n            verificationEvidence = "Bluetooth peer execution completed: ${targetNode.addressOrIp} fingerprint: ${targetNode.capabilityFingerprint} (duration: ${duration}ms); independent local verification required"')])
          edit('app/src/main/java/com/example/data/node/WastiMeshTransportEngine.kt', [('verificationStatus = try { UnifiedVerificationStatus.valueOf(vStatusStr) } catch (_: Exception) { UnifiedVerificationStatus.VERIFIED },','verificationStatus = try {\n                        val remoteStatus = UnifiedVerificationStatus.valueOf(vStatusStr)\n                        if (remoteStatus == UnifiedVerificationStatus.VERIFIED) UnifiedVerificationStatus.UNVERIFIED else remoteStatus\n                    } catch (_: Exception) { UnifiedVerificationStatus.UNVERIFIED },')])
          edit('app/src/main/java/com/example/data/agent/runtime/CapabilityInventionEngine.kt', [('verificationStatus = if (isSuccess) UnifiedVerificationStatus.VERIFIED else UnifiedVerificationStatus.FAILED,','verificationStatus = if (isSuccess) UnifiedVerificationStatus.UNVERIFIED else UnifiedVerificationStatus.FAILED,')])
          edit('app/src/main/java/com/example/ui/screens/CapabilityCenterScreen.kt', [('val isVerified = res.verificationStatus == UnifiedVerificationStatus.VERIFIED || res.status == UnifiedExecutionStatus.COMPLETED','val isVerified = res.verificationStatus == UnifiedVerificationStatus.VERIFIED')])
          edit('app/src/main/java/com/example/data/agent/runtime/WastiExplainabilityEngine.kt', [('val outcome = if (result.status == UnifiedExecutionStatus.COMPLETED || result.status == UnifiedExecutionStatus.VERIFIED) "Success" else "Failed (${result.status})"','val outcome = when {\n            result.verificationStatus == UnifiedVerificationStatus.VERIFIED -> "Verified"\n            result.status == UnifiedExecutionStatus.COMPLETED -> "Executed"\n            else -> "Failed (${result.status})"\n        }')])
          p=Path('app/src/main/java/com/example/data/agent/runtime/WastiObservationEngine.kt'); s=p.read_text(); s2=re.sub(r'    private fun isVerified\(executorResult: UnifiedExecutionResult\): Boolean =\n(?:        .*\n)+?(?=\n    )','    private fun isVerified(executorResult: UnifiedExecutionResult): Boolean =\n        executorResult.verificationStatus == UnifiedVerificationStatus.VERIFIED',s,count=1)
          if s2==s: raise SystemExit('MISSING PATTERN in WastiObservationEngine isVerified')
          p.write_text(s2)
          p=Path('app/src/main/java/com/example/data/ai/engine/SelfTrainingKnowledgeDistillationEngine.kt'); s=p.read_text()
          s=s.replace('            isFactuallyVerified = true\n','            isFactuallyVerified = verificationResult.status == ActionVerificationStatus.VERIFIED &&\n                verificationResult.structuredEvidence != null\n',1)
          s=s.replace('                isFactuallyVerified = isFactuallyVerified,\n                canonicalProvenanceEntryId = canonicalEntryId','                isFactuallyVerified = isVerified && canonicalEntryId != null && isFactuallyVerified,\n                canonicalProvenanceEntryId = canonicalEntryId',1)
          if 'isFactuallyVerified = isFactuallyVerified,' in s: raise SystemExit('UNSAFE factual verification assignment remains')
          p.write_text(s)
          edit('app/src/main/java/com/example/data/agent/runtime/WastiVerificationEngine.kt', [('        val isTrulyVerified = evidence.confidence >= MIN_VERIFIED_CONFIDENCE &&\n            evidence.subject.isNotBlank() &&\n            evidence.verifiedState.isNotBlank() &&\n            !isSyntheticOrMock(evidence.subject) &&\n            !isSyntheticOrMock(evidence.verifiedState) &&\n            !isStale','        val hasIndependentProof = !evidence.checksumOrHash.isNullOrBlank()\n\n        val isTrulyVerified = hasIndependentProof &&\n            evidence.confidence >= MIN_VERIFIED_CONFIDENCE &&\n            evidence.subject.isNotBlank() &&\n            evidence.verifiedState.isNotBlank() &&\n            !isSyntheticOrMock(evidence.subject) &&\n            !isSyntheticOrMock(evidence.verifiedState) &&\n            !isStale')])
          p=Path('app/src/main/java/com/example/data/agent/runtime/CapabilityRealityRegistry.kt'); s=p.read_text(); old='implementationStatus = ImplementationStatus.READY,\n                liveConnectionStatus = LiveConnectionStatus.NOT_VERIFIED,\n                executionStatus = CapabilityExecutionStatus.OPERATIONAL,'; new='implementationStatus = ImplementationStatus.READY,\n                liveConnectionStatus = LiveConnectionStatus.NOT_VERIFIED,\n                executionStatus = CapabilityExecutionStatus.UNAVAILABLE,'
          if old not in s: raise SystemExit('MISSING static capability pattern')
          p.write_text(s.replace(old,new))
          PY
      - name: Authority invariant scan
        shell: bash
        run: |
          ! grep -R --line-number 'isRealityVerified: Boolean = true' app/src/main
          ! grep -R --line-number 'WastiSovereign2026!' app/src/main
          ! grep -R --line-number 'verificationStatus = UnifiedVerificationStatus.VERIFIED' app/src/main/java/com/example/data/node app/src/main/java/com/example/data/agent/runtime/CapabilityInventionEngine.kt
          ! grep -R --line-number 'res.status == UnifiedExecutionStatus.COMPLETED' app/src/main/java/com/example/ui
      - name: Compile
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Commit hardened state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src .github/workflows/_final_authority_hardening.yml
          git commit -m 'security: enforce canonical verification authority' || exit 0
          git push
