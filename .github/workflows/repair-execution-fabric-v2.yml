name: Wasti canonical execution repair v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(execution):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch execution dispatch and deprecated consent calls
        shell: python
        run: |
          from pathlib import Path
          import re

          fabric = Path('app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt')
          s = fabric.read_text(encoding='utf-8')
          terminal = '''            capId.startsWith("wre_tool_") || capId in listOf(
                "terminal", "execute_code", "execute_command", "run_script", "sh", "cmd",
                "bash", "python", "python3", "python_runtime", "node", "nodejs",
                "node_runtime", "javascript", "npm"
            ) -> executeTerminalOperations(request, capId, ctx, startedAt)

'''
          registry = '''            com.example.data.tool.ToolRegistry.getTool(request.capabilityId) != null ||
            com.example.data.tool.ToolRegistry.getTool(capId) != null ->
                executeToolRegistryOperation(request, startedAt)

'''
          if terminal not in s or registry not in s:
              raise SystemExit('Canonical dispatch blocks not found; refusing mutation.')
          s = s.replace(registry + terminal, terminal + registry, 1)
          fabric.write_text(s, encoding='utf-8')

          replacements = {
              'app/src/test/java/com/example/data/core/EternalManifestoAndTruthAuditTest.kt': [
                  (r'pm\\.setUserConsent\\(("[^"]+"),\\s*(true|false)\\)', r'pm.setUserConsent(ApplicationProvider.getApplicationContext(), \\1, \\2)'),
                  (r'pm\\.hasUserConsent\\(("[^"]+")\\)', r'pm.hasUserConsent(ApplicationProvider.getApplicationContext(), \\1)'),
              ],
              'app/src/test/java/com/example/data/agent/runtime/Stage6ObservationVerificationTest.kt': [
                  (r'PermissionManager\\.setUserConsent\\(("[^"]+"),\\s*(true|false)\\)', r'PermissionManager.setUserConsent(ApplicationProvider.getApplicationContext(), \\1, \\2)'),
              ],
          }
          for name, rules in replacements.items():
              p = Path(name)
              if not p.exists():
                  continue
              t = p.read_text(encoding='utf-8')
              for pattern, repl in rules:
                  t = re.sub(pattern, repl, t)
              p.write_text(t, encoding='utf-8')

          stage14 = Path('app/src/test/java/com/example/Stage14SelfEvolvingCapabilityEngineTest.kt')
          t = stage14.read_text(encoding='utf-8')
          marker = 'fun testTerminalCapabilityDoesNotRecursivelyReenterFabric()'
          if marker not in t:
              method = '''    @Test
    fun testTerminalCapabilityDoesNotRecursivelyReenterFabric() = runTest(testDispatcher) {
        assertNotNull("Terminal capability must remain discoverable", ToolRegistry.getTool("terminal"))
        val request = UnifiedExecutionRequest(
            capabilityId = "terminal",
            parameters = mapOf("command" to "printf wasti-terminal-routing", "workingDirectory" to "home/wasti"),
            requestedStrategy = com.example.data.agent.runtime.ExecutionStrategy.LOCAL_FALLBACK,
            timeoutMs = 5_000L
        )
        val result = UnifiedExecutionFabric.instance.execute(request, context)
        assertFalse("Terminal execution must not recurse into UnifiedExecutionFabric", result.error?.contains("StackOverflowError", true) == true)
        assertTrue("Terminal routing must reach the real executor: ${result.output}", result.output.contains("wasti-terminal-routing") || result.status == UnifiedExecutionStatus.UNAVAILABLE)
    }

'''
              i = t.rfind('\n}')
              if i < 0:
                  raise SystemExit('Stage14 class terminator not found.')
              stage14.write_text(t[:i] + '\n' + method + t[i:], encoding='utf-8')

      - name: Run Stage 14 regression
        run: ./gradlew :app:testDebugUnitTest --tests 'com.example.Stage14SelfEvolvingCapabilityEngineTest' --no-configuration-cache --stacktrace
        timeout-minutes: 10

      - name: Commit verified source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt \
                  app/src/test/java/com/example/Stage14SelfEvolvingCapabilityEngineTest.kt \
                  app/src/test/java/com/example/data/agent/runtime/Stage6ObservationVerificationTest.kt \
                  app/src/test/java/com/example/data/core/EternalManifestoAndTruthAuditTest.kt
          git rm .github/workflows/repair-execution-fabric.yml .github/workflows/repair-execution-fabric-v2.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(execution): prevent terminal fabric recursion and remove consent deprecations'
          git push origin HEAD:main
