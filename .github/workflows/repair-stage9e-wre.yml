name: Repair Stage9E WRE Verification

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply exact source repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fabric = Path("app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt")
          text = fabric.read_text()
          old = '''                ActionVerificationStatus.VERIFICATION_UNAVAILABLE, ActionVerificationStatus.NOT_VERIFIABLE -> {
                    // Execution succeeded, but independent verification is unavailable: stay COMPLETED (never claim VERIFIED)
                    if (execResult.status == UnifiedExecutionStatus.VERIFIED) {
                        UnifiedExecutionStatus.COMPLETED
                    } else {
                        execResult.status
                    }
                }
                ActionVerificationStatus.UNKNOWN -> {
                    if (execResult.status == UnifiedExecutionStatus.VERIFIED) {
                        UnifiedExecutionStatus.COMPLETED
                    } else {
                        execResult.status
                    }
                }'''
          new = '''                ActionVerificationStatus.VERIFICATION_UNAVAILABLE, ActionVerificationStatus.NOT_VERIFIABLE -> {
                    // A VERIFIED result already carries canonical WastiVerificationEngine evidence
                    // from the authoritative executor (for example WRE). Do not downgrade that
                    // proven result merely because a second observation channel is unavailable.
                    if (execResult.status == UnifiedExecutionStatus.VERIFIED &&
                        execResult.verificationStatus == UnifiedVerificationStatus.VERIFIED
                    ) {
                        UnifiedExecutionStatus.VERIFIED
                    } else {
                        execResult.status
                    }
                }
                ActionVerificationStatus.UNKNOWN -> {
                    if (execResult.status == UnifiedExecutionStatus.VERIFIED &&
                        execResult.verificationStatus == UnifiedVerificationStatus.VERIFIED
                    ) {
                        UnifiedExecutionStatus.VERIFIED
                    } else {
                        execResult.status
                    }
                }'''
          if text.count(old) != 1:
              raise SystemExit(f"UnifiedExecutionFabric target count was {text.count(old)}, expected 1")
          fabric.write_text(text.replace(old, new, 1))

          chat = Path("app/src/main/java/com/example/ui/screens/ChatWorkspaceScreen.kt")
          text = chat.read_text()
          old_guard = '''    if (ttsEngine != null) {
        try {'''
          if text.count(old_guard) != 1:
              raise SystemExit(f"ChatWorkspaceScreen TTS guard count was {text.count(old_guard)}, expected 1")
          text = text.replace(old_guard, '''    try {''', 1)
          old_else = '''    } else {
        kotlinx.coroutines.CoroutineScope(kotlinx.coroutines.Dispatchers.IO).launch {
            try {
                VoiceManager.synthesizeSpeech(ttsTextToSpeak)
            } catch (_: Throwable) {}
        }
    }
}'''
          if text.count(old_else) != 1:
              raise SystemExit(f"ChatWorkspaceScreen TTS fallback count was {text.count(old_else)}, expected 1")
          text = text.replace(old_else, '''}''', 1)
          chat.write_text(text)
          PY

      - name: Verify exact changes
        shell: bash
        run: |
          ! grep -R -n '::ttsEngine\.isInitialized' app/src/main/java/com/example/ui/screens/ChatWorkspaceScreen.kt
          ! grep -n 'if (ttsEngine != null)' app/src/main/java/com/example/ui/screens/ChatWorkspaceScreen.kt
          grep -n 'canonical WastiVerificationEngine evidence' app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt

      - name: Run Stage9E regression suite
        run: ./gradlew testDebugUnitTest --tests com.example.data.workflow.Stage9EWorkflowOrchestrationTest --no-configuration-cache --no-build-cache --stacktrace --warning-mode all

      - name: Commit and push verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt app/src/main/java/com/example/ui/screens/ChatWorkspaceScreen.kt
          git diff --cached --check
          git diff --cached --quiet && { echo "No source changes remain; nothing to commit."; exit 0; }
          git commit -m "fix(wre): preserve canonical verified execution evidence"
          git push origin HEAD:main

      - name: Remove repair workflow after successful push
        if: success()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B cleanup origin/main
          rm -f .github/workflows/repair-stage9e-wre.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/repair-stage9e-wre.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: remove one-shot repair workflow"
          git push origin HEAD:main
