name: One-Time Precision Warning Fix
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v7
      - name: Apply exact warning fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/screens/OperationsDashboardScreen.kt')
          s = p.read_text()
          old = 'Icons.Default.OpenInNew'
          new = 'Icons.AutoMirrored.Filled.OpenInNew'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'ABORT: expected exactly 2 {old} occurrences, found {count}')
          p.write_text(s.replace(old, new))

          p = Path('app/build.gradle.kts')
          s = p.read_text()
          old = 'implementation(libs.firebase.appcheck.recaptcha)'
          new = 'implementation(libs.firebase.appcheck.playintegrity)'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'ABORT: expected exactly 1 App Check reCAPTCHA dependency line, found {count}')
          p.write_text(s.replace(old, new))

          p = Path('gradle/libs.versions.toml')
          s = p.read_text()
          old = 'firebase-appcheck-recaptcha = { group = "com.google.firebase", name = "firebase-appcheck-recaptcha" }'
          new = old + '\nfirebase-appcheck-playintegrity = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity" }'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'ABORT: expected exactly 1 Firebase App Check reCAPTCHA catalog entry, found {count}')
          p.write_text(s.replace(old, new))
          PY

          git diff --check
          test "$(git diff -- app/src/main/java/com/example/ui/screens/OperationsDashboardScreen.kt | grep -c '^[-+]\s*.*OpenInNew' || true)" -eq 4
          git diff --stat
          git diff -- app/src/main/java/com/example/ui/screens/OperationsDashboardScreen.kt app/build.gradle.kts gradle/libs.versions.toml
      - name: Commit exact changes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/precision-warning-fix.yml
          git add app/src/main/java/com/example/ui/screens/OperationsDashboardScreen.kt app/build.gradle.kts gradle/libs.versions.toml
          git commit -m 'fix: remove remaining release build warnings without changing behavior'
          git push origin HEAD:main
