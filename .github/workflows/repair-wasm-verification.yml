name: Repair WASM Verification

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: repair WASM verification evidence'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch WASM evidence path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt")
          s = p.read_text(encoding="utf-8")
          old = '''        val res = wasmRuntime.runSandboxedScript(toolName, expression, pMap)\n        val status = if (res.isSuccess) UnifiedExecutionStatus.VERIFIED else UnifiedExecutionStatus.FAILED\n        val output = res.stringOutput ?: (if (res.isSuccess) "WASM sandboxed tool executed successfully. Fuel: ${res.fuelConsumed}" else (res.diagnosticMessage ?: "WASM execution failed"))\n\n        return createResult(\n            request = request,\n            status = status,\n            output = output,\n            error = if (res.isSuccess) null else res.diagnosticMessage,\n            executor = "WastiWasmRuntime",\n            startedAt = startedAt,\n            verificationStatus = if (res.isSuccess) UnifiedVerificationStatus.VERIFIED else UnifiedVerificationStatus.FAILED,\n            verificationEvidence = if (res.isSuccess) "WASM Execution verified [${wasmRuntime.engineType.name}], fuel: ${res.fuelConsumed}" else "WASM Execution failed: ${res.diagnosticMessage}"\n        )'''
          new = '''        val res = wasmRuntime.runSandboxedScript(toolName, expression, pMap)\n        val status = if (res.isSuccess) UnifiedExecutionStatus.VERIFIED else UnifiedExecutionStatus.FAILED\n        val output = res.stringOutput ?: (if (res.isSuccess) "WASM sandboxed tool executed successfully. Fuel: ${res.fuelConsumed}" else (res.diagnosticMessage ?: "WASM execution failed"))\n        val verificationEvidence = if (res.isSuccess) "WASM Execution verified [${wasmRuntime.engineType.name}], fuel: ${res.fuelConsumed}" else "WASM Execution failed: ${res.diagnosticMessage}"\n        val structuredEvidence = if (res.isSuccess) {\n            VerifiedExecutionEvidence(\n                evidenceSource = EvidenceSource.RUNTIME_DIAGNOSTIC,\n                subject = "WastiWasmRuntime:$toolName",\n                verifiedState = "WASM_EXECUTION_COMPLETED",\n                checksumOrHash = "sha256:" + java.security.MessageDigest.getInstance("SHA-256")\n                    .digest(output.toByteArray(Charsets.UTF_8))\n                    .joinToString("") { "%02x".format(it) },\n                observedAt = System.currentTimeMillis(),\n                confidence = 1.0\n            )\n        } else null\n\n        return createResult(\n            request = request,\n            status = status,\n            output = output,\n            error = if (res.isSuccess) null else res.diagnosticMessage,\n            executor = "WastiWasmRuntime",\n            startedAt = startedAt,\n            verificationStatus = if (res.isSuccess) UnifiedVerificationStatus.VERIFIED else UnifiedVerificationStatus.FAILED,\n            verificationEvidence = verificationEvidence,\n            verifiedExecutionEvidence = structuredEvidence\n        )'''
          if old not in s:
              raise SystemExit("Expected WASM execution block not found; refusing to modify unrelated code")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Verify patch shape
        shell: bash
        run: |
          grep -q 'subject = "WastiWasmRuntime:$toolName"' app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt
          grep -q 'verifiedExecutionEvidence = structuredEvidence' app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt
      - name: Commit and remove repair workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-wasm-verification.yml
          git add app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt .github/workflows/repair-wasm-verification.yml
          git commit -m "fix: repair WASM verification evidence"
          git push origin HEAD:main
