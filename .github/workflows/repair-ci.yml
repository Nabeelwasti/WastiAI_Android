name: One-Time CI Stability Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Repair canonical test configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/build-apk.yml')
          text = workflow.read_text()
          old = '''    - name: Run Unit Tests\n      timeout-minutes: 15\n      run: ./gradlew testDebugUnitTest --no-configuration-cache --no-build-cache --stacktrace'''
          new = '''    - name: Run Unit Tests\n      timeout-minutes: 30\n      run: |\n        set -o pipefail\n        echo "=== Wasti test guard: 30 minute CI ceiling ==="\n        timeout --foreground --kill-after=30s 29m ./gradlew testDebugUnitTest --stacktrace\n        echo "=== Wasti test suite completed ==="'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'timeout-minutes: 30' not in text or 'timeout --foreground --kill-after=30s 29m ./gradlew testDebugUnitTest' not in text:
              raise SystemExit('Expected Run Unit Tests block not found; refusing unsafe workflow rewrite.')
          workflow.write_text(text)

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          if 'test.maxParallelForks = 1' in text:
              text = re.sub(r'test\.maxParallelForks\s*=\s*[^\n]+', 'test.maxParallelForks = 1', text, count=1)
          elif 'test.maxParallelForks' in text:
              text = re.sub(r'test\.maxParallelForks\s*=\s*[^\n]+', 'test.maxParallelForks = 1', text, count=1)
          if 'test.failFast' in text:
              text = re.sub(r'test\.failFast\s*=\s*[^\n]+', 'test.failFast = false', text, count=1)
          else:
              marker = '        test.maxParallelForks = 1\n'
              if marker not in text:
                  raise SystemExit('Could not locate test configuration; refusing unsafe Gradle rewrite.')
              text = text.replace(marker, marker + '        test.failFast = false\n', 1)
          if 'test.timeout.set(Duration.ofMinutes(25))' not in text:
              marker = '        test.failFast = false\n'
              if marker not in text:
                  raise SystemExit('Could not locate failFast configuration; refusing unsafe Gradle rewrite.')
              text = text.replace(marker, marker + '        test.timeout.set(Duration.ofMinutes(25))\n', 1)
          gradle.write_text(text)
          PY

      - name: Validate repair
        run: |
          set -euo pipefail
          grep -F 'timeout-minutes: 30' .github/workflows/build-apk.yml
          grep -F 'timeout --foreground --kill-after=30s 29m ./gradlew testDebugUnitTest' .github/workflows/build-apk.yml
          grep -F 'test.maxParallelForks = 1' app/build.gradle.kts
          grep -F 'test.failFast = false' app/build.gradle.kts
          grep -F 'test.timeout.set(Duration.ofMinutes(25))' app/build.gradle.kts
          echo 'Canonical CI/test configuration is valid.'

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wasti-ci-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-apk.yml app/build.gradle.kts
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git commit -m "ci: repair canonical test configuration"
          git push origin HEAD:main
