name: Safe Repair Series

on:
  push:
    branches:
      - repair/stage9e-safe-series

permissions:
  contents: write

jobs:
  repair-one-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch exactly one production file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          fabric = Path("app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt")
          chat = Path("app/src/main/java/com/example/ui/screens/ChatWorkspaceScreen.kt")

          text = fabric.read_text(encoding="utf-8")

          if "val verifiedExecutionEvidence: VerifiedExecutionEvidence? = null" not in text:
              old = "    val verificationEvidence: String? = null,\n    val exitCode: Int? = null,"
              new = "    val verificationEvidence: String? = null,\n    val verifiedExecutionEvidence: VerifiedExecutionEvidence? = null,\n    val exitCode: Int? = null,"
              if text.count(old) != 1:
                  raise SystemExit("SAFE PATCH ABORT: UnifiedExecutionResult anchor count != 1")
              text = text.replace(old, new, 1)

              old = "            verificationEvidence = if (wreResult.verified) wreResult.verificationEvidence ?: \"VERIFIED\" else \"UNVERIFIED\",\n            exitCode = wreResult.exitCode"
              new = "            verificationEvidence = if (wreResult.verified) wreResult.verificationEvidence ?: \"VERIFIED\" else \"UNVERIFIED\",\n            verifiedExecutionEvidence = wreResult.verifiedExecutionEvidence,\n            exitCode = wreResult.exitCode"
              if text.count(old) != 1:
                  raise SystemExit("SAFE PATCH ABORT: WRE result mapping anchor count != 1")
              text = text.replace(old, new, 1)

              pattern = re.compile(r"            val structuredEvidence = if \(result\.status == UnifiedExecutionStatus\.VERIFIED \|\| result\.verificationStatus == UnifiedVerificationStatus\.VERIFIED\) \{.*?\n            \}\n\n            val verRequest = VerificationRequest\(", re.S)
              replacement = "            val structuredEvidence = result.verifiedExecutionEvidence\n\n            val verRequest = VerificationRequest("
              text, n = pattern.subn(replacement, text, count=1)
              if n != 1:
                  raise SystemExit(f"SAFE PATCH ABORT: synthetic structured-evidence block matches={n}")

              fabric.write_text(text, encoding="utf-8")
              print("PATCHED: UnifiedExecutionFabric.kt")
          elif "val verifiedExecutionEvidence: VerifiedExecutionEvidence? = null" in text and "val structuredEvidence = result.verifiedExecutionEvidence" in text:
              print("ALREADY PATCHED: UnifiedExecutionFabric.kt")
          else:
              raise SystemExit("SAFE PATCH ABORT: UnifiedExecutionFabric.kt is in an unexpected partial state")

          # The second source fix is intentionally deferred to the next push/run.
          # This workflow commits exactly one production source file per run.
          PY

      - name: Commit and push exactly one source-file repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt; then
            echo "No production-file change to commit on this run."
            exit 0
          fi
          git config user.name "wasti-safe-repair"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt
          git commit -m "fix(execution): preserve WRE verified evidence through unified fabric"
          git push origin HEAD:repair/stage9e-safe-series
