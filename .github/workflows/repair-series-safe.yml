# cleanup-trigger
name: Safe Repair Series

on:
  push:
    branches:
      - repair/stage9e-safe-series

permissions:
  contents: write

jobs:
  cleanup-repair-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify both source repairs and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          fabric = Path("app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt")
          chat = Path("app/src/main/java/com/example/ui/screens/ChatWorkspaceScreen.kt")
          workflow = Path(".github/workflows/repair-series-safe.yml")
          f = fabric.read_text(encoding="utf-8")
          c = chat.read_text(encoding="utf-8")
          required_fabric = [
              "val verifiedExecutionEvidence: VerifiedExecutionEvidence? = null",
              "verifiedExecutionEvidence = wreResult.verifiedExecutionEvidence,",
              "structuredEvidence = execResult.verifiedExecutionEvidence"
          ]
          for marker in required_fabric:
              if marker not in f:
                  raise SystemExit(f"CLEANUP ABORT: missing fabric repair marker: {marker}")
          if "if (ttsEngine != null) {" in c:
              raise SystemExit("CLEANUP ABORT: unreachable TTS branch still present")
          workflow.unlink()
          print("VERIFIED: both source repairs present; temporary runner removed")
          PY

      - name: Commit runner cleanup only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wasti-safe-repair"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/repair-series-safe.yml
          git diff --cached --quiet && { echo "Cleanup file already absent"; exit 1; }
          git commit -m "chore(repair): remove temporary safe repair runner"
          git push origin HEAD:repair/stage9e-safe-series
