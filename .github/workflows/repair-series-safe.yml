# phase-2-trigger
name: Safe Repair Series

on:
  push:
    branches:
      - repair/stage9e-safe-series

permissions:
  contents: write

jobs:
  repair-one-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch exactly one production file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          fabric = Path("app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt")
          chat = Path("app/src/main/java/com/example/ui/screens/ChatWorkspaceScreen.kt")
          f = fabric.read_text(encoding="utf-8")
          if "val verifiedExecutionEvidence: VerifiedExecutionEvidence? = null" not in f:
              raise SystemExit("SAFE PATCH ABORT: Phase 1 source repair is missing")
          if "structuredEvidence = execResult.verifiedExecutionEvidence" not in f:
              raise SystemExit("SAFE PATCH ABORT: Phase 1 verification propagation is missing")

          c = chat.read_text(encoding="utf-8")
          old = '''    if (ttsEngine != null) {\n        try {\n            val result = ttsEngine.setLanguage(targetLocale)\n            if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {\n                ttsEngine.language = Locale.ENGLISH\n            }\n            val params = android.os.Bundle()\n            params.putString(TextToSpeech.Engine.KEY_PARAM_UTTERANCE_ID, "chat_tts_dual_pipeline")\n            ttsEngine.speak(ttsTextToSpeak, TextToSpeech.QUEUE_FLUSH, params, "chat_tts_dual_pipeline")\n        } catch (e: Exception) {\n            android.util.Log.e("ChatWorkspaceTTS", "Error in TTS speak, falling back to VoiceManager", e)\n            kotlinx.coroutines.CoroutineScope(kotlinx.coroutines.Dispatchers.IO).launch {\n                try {\n                    VoiceManager.synthesizeSpeech(ttsTextToSpeak)\n                } catch (_: Throwable) {}\n            }\n        }\n    } else {\n        kotlinx.coroutines.CoroutineScope(kotlinx.coroutines.Dispatchers.IO).launch {\n            try {\n                VoiceManager.synthesizeSpeech(ttsTextToSpeak)\n            } catch (_: Throwable) {}\n        }\n    }'''
          new = '''    try {\n        val result = ttsEngine.setLanguage(targetLocale)\n        if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {\n            ttsEngine.language = Locale.ENGLISH\n        }\n        val params = android.os.Bundle()\n        params.putString(TextToSpeech.Engine.KEY_PARAM_UTTERANCE_ID, "chat_tts_dual_pipeline")\n        ttsEngine.speak(ttsTextToSpeak, TextToSpeech.QUEUE_FLUSH, params, "chat_tts_dual_pipeline")\n    } catch (e: Exception) {\n        android.util.Log.e("ChatWorkspaceTTS", "Error in TTS speak, falling back to VoiceManager", e)\n        kotlinx.coroutines.CoroutineScope(kotlinx.coroutines.Dispatchers.IO).launch {\n            try {\n                VoiceManager.synthesizeSpeech(ttsTextToSpeak)\n            } catch (_: Throwable) {}\n        }\n    }'''
          if c.count(old) != 1:
              raise SystemExit("SAFE PATCH ABORT: TTS unreachable-branch anchor count != 1")
          chat.write_text(c.replace(old, new, 1), encoding="utf-8")
          print("PATCHED: ChatWorkspaceScreen.kt")
          PY

      - name: Commit and push exactly one file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wasti-safe-repair"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/ChatWorkspaceScreen.kt
          git diff --cached --quiet && { echo "No ChatWorkspaceScreen.kt change"; exit 1; }
          git commit -m "fix(ui): remove unreachable TTS null branch"
          git push origin HEAD:repair/stage9e-safe-series
