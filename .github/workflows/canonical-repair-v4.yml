name: Source-first Wasti repair

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.issue.title == 'CANONICAL_WASTI_REPAIR_V4'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply verified execution routing fix and warning cleanup
        shell: python
        run: |
          from pathlib import Path
          fabric=Path('app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt')
          s=fabric.read_text()
          terminal='''            capId.startsWith("wre_tool_") || capId in listOf(\n                "terminal", "execute_code", "execute_command", "run_script", "sh", "cmd",\n                "bash", "python", "python3", "python_runtime", "node", "nodejs",\n                "node_runtime", "javascript", "npm"\n            ) -> executeTerminalOperations(request, capId, ctx, startedAt)\n\n'''
          registry='''            com.example.data.tool.ToolRegistry.getTool(request.capabilityId) != null ||\n            com.example.data.tool.ToolRegistry.getTool(capId) != null ->\n                executeToolRegistryOperation(request, startedAt)\n\n'''
          if terminal not in s or registry not in s: raise SystemExit('Expected canonical dispatch blocks not found')
          if s.index(terminal)>s.index(registry): s=s.replace(registry+terminal,terminal+registry,1)
          fabric.write_text(s)
          files=[
            Path('app/src/test/java/com/example/data/core/EternalManifestoAndTruthAuditTest.kt'),
            Path('app/src/test/java/com/example/data/agent/runtime/Stage6ObservationVerificationTest.kt')]
          for p in files:
            if not p.exists(): continue
            t=p.read_text()
            t=t.replace('pm.setUserConsent("','pm.setUserConsent(ApplicationProvider.getApplicationContext(), "')
            t=t.replace('pm.hasUserConsent("','pm.hasUserConsent(ApplicationProvider.getApplicationContext(), "')
            t=t.replace('PermissionManager.setUserConsent("','PermissionManager.setUserConsent(ApplicationProvider.getApplicationContext(), "')
            p.write_text(t)
      - name: Assert source truth
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt').read_text()
          assert s.index('capId.startsWith("wre_tool_")') < s.index('ToolRegistry.getTool(request.capabilityId)')
          print('PASS: terminal/WRE dispatch precedes generic registry dispatch')
          PY
      - name: Commit source repair before long validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt app/src/test/java/com/example/data/agent/runtime/Stage6ObservationVerificationTest.kt app/src/test/java/com/example/data/core/EternalManifestoAndTruthAuditTest.kt
          if git diff --cached --quiet; then echo 'No source changes required'; else git commit -m 'fix(execution): prevent recursive tool routing and modernize consent APIs'; git push origin HEAD:main; fi
      - name: Targeted Stage 14 regression
        run: ./gradlew :app:testDebugUnitTest --tests 'com.example.Stage14SelfEvolvingCapabilityEngineTest.testF_CapabilityPromotionAndUnifiedExecution' --no-configuration-cache --stacktrace
        timeout-minutes: 10
      - name: Compile and lint
        run: ./gradlew :app:compileDebugKotlin :app:lintDebug --no-configuration-cache --stacktrace
        timeout-minutes: 12
      - name: Full JVM unit-test suite
        run: ./gradlew :app:testDebugUnitTest --no-configuration-cache --stacktrace
        timeout-minutes: 25
