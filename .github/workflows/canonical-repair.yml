name: Canonical Wasti repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply canonical dispatch repair
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt')
          s = p.read_text(encoding='utf-8')
          terminal = '''            capId.startsWith("wre_tool_") || capId in listOf(\n                "terminal", "execute_code", "execute_command", "run_script", "sh", "cmd",\n                "bash", "python", "python3", "python_runtime", "node", "nodejs",\n                "node_runtime", "javascript", "npm"\n            ) -> executeTerminalOperations(request, capId, ctx, startedAt)\n\n'''
          registry = '''            com.example.data.tool.ToolRegistry.getTool(request.capabilityId) != null ||\n            com.example.data.tool.ToolRegistry.getTool(capId) != null ->\n                executeToolRegistryOperation(request, startedAt)\n\n'''
          if terminal not in s or registry not in s:
              raise SystemExit('Expected canonical dispatch blocks not found; refusing mutation')
          # Terminal is a built-in execution boundary. It must win before the generic registry fallback.
          s = s.replace(registry + terminal, terminal + registry, 1)
          p.write_text(s, encoding='utf-8')

      - name: Remove deprecated consent API usage
        shell: python
        run: |
          from pathlib import Path
          replacements = {
            'app/src/test/java/com/example/data/core/EternalManifestoAndTruthAuditTest.kt': [
              ('pm.setUserConsent("', 'pm.setUserConsent(ApplicationProvider.getApplicationContext(), "'),
              ('pm.hasUserConsent("', 'pm.hasUserConsent(ApplicationProvider.getApplicationContext(), "'),
            ],
            'app/src/test/java/com/example/data/agent/runtime/Stage6ObservationVerificationTest.kt': [
              ('PermissionManager.setUserConsent("', 'PermissionManager.setUserConsent(ApplicationProvider.getApplicationContext(), "'),
            ],
          }
          for name, rules in replacements.items():
            p = Path(name)
            if not p.exists():
              continue
            s = p.read_text(encoding='utf-8')
            for old, new in rules:
              s = s.replace(old, new)
            p.write_text(s, encoding='utf-8')

      - name: Validate source invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt').read_text()
          t=s.index('capId.startsWith("wre_tool_")')
          r=s.index('ToolRegistry.getTool(request.capabilityId)')
          assert t < r, 'terminal dispatch still occurs after ToolRegistry fallback'
          print('PASS: terminal dispatch precedes generic ToolRegistry fallback')
          PY

      - name: Run Stage 14 regression
        run: ./gradlew :app:testDebugUnitTest --tests 'com.example.Stage14SelfEvolvingCapabilityEngineTest' --no-configuration-cache --stacktrace
        timeout-minutes: 15

      - name: Run compile and lint validation
        run: ./gradlew :app:compileDebugKotlin :app:lintDebug --no-configuration-cache --stacktrace
        timeout-minutes: 15

      - name: Commit verified source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/agent/runtime/UnifiedExecutionFabric.kt \
            app/src/test/java/com/example/data/agent/runtime/Stage6ObservationVerificationTest.kt \
            app/src/test/java/com/example/data/core/EternalManifestoAndTruthAuditTest.kt
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix(execution): restore canonical terminal dispatch and consent APIs'
          git push origin HEAD:main
