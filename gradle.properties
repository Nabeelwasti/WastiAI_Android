# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
org.gradle.warning.mode=all
org.gradle.configuration-cache=false

# Kotlin / Android
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true

# Google Services may be supplied securely by CI before the build.
googleServices.missing.passthrough=true
android.disallowKotlinSourceSets=false
android.suppressUnsupportedCompileSdk=37
ksp.useKSP2=false
ksp.useKspAA=false

# CI validation marker: final source state after toolchain and warning cleanup.
